<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Painel FFF</title>
<meta name="description" content="Sistema executivo de acompanhamento da operação FFF — 14 áreas, atualização diária por pauta em Word." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PAINEL FFF — DESIGN SYSTEM v2
   Apple-disciplined composition · Linear precision · Stripe finish
   Identidade extraída do gradiente da marca FEAT FOR FIT
   ============================================================ */
:root{
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;

  /* ---- superfícies & tinta (claro) ---- */
  --bg: #F6F4EF;
  --bg-soft: #FBFAF7;
  --surface: #FFFFFF;
  --surface-2: #F1EEE7;
  --surface-3: #E8E3D9;
  --border: #E6E1D6;
  --border-strong: #D2CBBB;
  --ink: #131219;
  --ink-2: #55524B;
  --ink-3: #8E897B;
  --ink-inverse: #FDFCFA;

  /* ---- identidade FEAT FOR FIT (do logótipo: índigo → violeta → magenta) ---- */
  --brand-1: #4E4BE0;
  --brand-2: #8A50EC;
  --brand-3: #D843A6;
  --brand-gradient: linear-gradient(120deg, var(--brand-1) 0%, var(--brand-2) 52%, var(--brand-3) 100%);
  --brand-gradient-soft: linear-gradient(120deg, color-mix(in srgb, var(--brand-1) 16%, transparent), color-mix(in srgb, var(--brand-2) 16%, transparent) 55%, color-mix(in srgb, var(--brand-3) 16%, transparent));

  --accent: #7A4FE0;
  --accent-2: #A63FBE;
  --accent-ink: #5C36BE;
  --accent-wash: #F1ECFC;
  --accent-wash-strong: #E4D9FA;
  --accent-glow: rgba(122,79,224,.30);

  /* ---- semânticas (refinadas, nunca gritantes) ---- */
  --danger: #C6483B;
  --danger-ink: #A5352A;
  --danger-wash: #FBEBE8;
  --warning: #B0740D;
  --warning-ink: #8F5E0A;
  --warning-wash: #FAF0DC;
  --success: #17845A;
  --success-ink: #106B48;
  --success-wash: #E6F5EE;
  --neutral-chip: #F0EDE6;

  /* ---- espaçamento ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px;

  /* ---- forma ---- */
  --r-xs: 6px; --r-sm: 9px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;

  /* ---- profundidade — muito suave, quase imperceptível ---- */
  --shadow-xs: 0 1px 1px rgba(19,18,25,.04);
  --shadow-sm: 0 2px 8px rgba(19,18,25,.05), 0 1px 2px rgba(19,18,25,.04);
  --shadow-md: 0 10px 28px rgba(19,18,25,.08), 0 2px 8px rgba(19,18,25,.05);
  --shadow-lg: 0 24px 64px rgba(19,18,25,.16), 0 4px 14px rgba(19,18,25,.07);
  --shadow-glow: 0 10px 26px -6px var(--accent-glow);

  /* ---- vidro (uso pontual: header, dock, modais) ---- */
  --glass-bg: color-mix(in srgb, var(--surface) 74%, transparent);
  --glass-bg-strong: color-mix(in srgb, var(--surface) 88%, transparent);
  --glass-border: color-mix(in srgb, var(--border-strong) 70%, transparent);

  --ease: cubic-bezier(.22,1,.36,1);
  --ease-soft: cubic-bezier(.32,.9,.34,1);

  --header-h: 60px;
  --dock-h: 56px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #0F0E13;
    --bg-soft: #131219;
    --surface: #18171F;
    --surface-2: #1E1D26;
    --surface-3: #27252F;
    --border: #2C2A35;
    --border-strong: #3C3945;
    --ink: #F3F1EC;
    --ink-2: #B7B2A8;
    --ink-3: #7C7A87;
    --ink-inverse: #14131A;

    --brand-1: #6E6BF5;
    --brand-2: #A374F5;
    --brand-3: #E667BE;
    --accent: #9C81F5;
    --accent-2: #C767D8;
    --accent-ink: #C6B4FA;
    --accent-wash: #262143;
    --accent-wash-strong: #322A58;
    --accent-glow: rgba(156,129,245,.35);

    --danger: #E58579;
    --danger-ink: #F0A99F;
    --danger-wash: #33201D;
    --warning: #E0AC55;
    --warning-ink: #EBC17E;
    --warning-wash: #322712;
    --success: #63C79A;
    --success-ink: #8CDBB4;
    --success-wash: #142E22;
    --neutral-chip: #232129;

    --glass-bg: color-mix(in srgb, var(--surface) 66%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--surface) 84%, transparent);
    --glass-border: color-mix(in srgb, var(--border-strong) 60%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg: #0F0E13; --bg-soft: #131219; --surface: #18171F; --surface-2: #1E1D26; --surface-3: #27252F;
  --border: #2C2A35; --border-strong: #3C3945; --ink: #F3F1EC; --ink-2: #B7B2A8; --ink-3: #7C7A87; --ink-inverse: #14131A;
  --brand-1: #6E6BF5; --brand-2: #A374F5; --brand-3: #E667BE;
  --accent: #9C81F5; --accent-2: #C767D8; --accent-ink: #C6B4FA; --accent-wash: #262143; --accent-wash-strong: #322A58; --accent-glow: rgba(156,129,245,.35);
  --danger: #E58579; --danger-ink: #F0A99F; --danger-wash: #33201D;
  --warning: #E0AC55; --warning-ink: #EBC17E; --warning-wash: #322712;
  --success: #63C79A; --success-ink: #8CDBB4; --success-wash: #142E22;
  --neutral-chip: #232129;
  --glass-bg: color-mix(in srgb, var(--surface) 66%, transparent);
  --glass-bg-strong: color-mix(in srgb, var(--surface) 84%, transparent);
  --glass-border: color-mix(in srgb, var(--border-strong) 60%, transparent);
  color-scheme: dark;
}

*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: var(--bg);
  background-image:
    radial-gradient(760px 420px at 100% -8%, color-mix(in srgb, var(--brand-2) 7%, transparent), transparent 60%),
    radial-gradient(620px 380px at -6% 8%, color-mix(in srgb, var(--brand-1) 6%, transparent), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1,h2,h3,h4,p{ margin:0; }
button{ font-family: inherit; }
::selection{ background: var(--accent-wash-strong); }
a{ color: inherit; }
.tnum{ font-variant-numeric: tabular-nums; }
svg{ display:block; }
::-webkit-scrollbar{ width:10px; height:8px; }
::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 8px; }
::-webkit-scrollbar-track{ background: transparent; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

@keyframes fffFadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@keyframes fffPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
@keyframes fffSpin{ to{ transform:rotate(360deg); } }
.anim-in{ animation: fffFadeUp .38s var(--ease-soft) both; }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{ min-height:100%; display:flex; flex-direction:column; }

.header{
  position:sticky; top:0; z-index:40;
  height: var(--header-h);
  display:flex; align-items:center; gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(18px) saturate(1.5);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  border-bottom:1px solid var(--glass-border);
}
.header__brand{ display:flex; align-items:center; gap:10px; flex:none; cursor:pointer; }
.header__logo{ height:23px; width:auto; display:block; }
.header__brandtext{ display:flex; flex-direction:column; line-height:1.05; }
.header__brandtext b{ font-family:var(--font-display); font-size:13px; font-weight:800; letter-spacing:-.01em; }
.header__brandtext span{ font-size:10px; color:var(--ink-3); letter-spacing:.03em; }
.header__spacer{ flex:1 1 auto; }
.header__actions{ display:flex; align-items:center; gap: var(--sp-2); flex:none; }

.searchtrigger{
  display:inline-flex; align-items:center; gap:9px; height:34px; padding:0 10px 0 12px;
  border-radius: var(--r-pill); border:1px solid var(--border); background: var(--surface);
  color: var(--ink-3); font-size:12.3px; cursor:pointer; transition: all .15s var(--ease);
}
.searchtrigger:hover{ border-color:var(--border-strong); color:var(--ink-2); box-shadow: var(--shadow-xs); }
.searchtrigger svg{ width:14px; height:14px; flex:none; }
.searchtrigger .kbd{ margin-left:2px; }

.iconbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:34px; padding:0 11px;
  border-radius: var(--r-sm);
  border:1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  font-size:12.5px; font-weight:600;
  cursor:pointer;
  transition: background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease), transform .14s var(--ease), box-shadow .14s var(--ease);
  white-space:nowrap;
}
.iconbtn:hover{ background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
.iconbtn:active{ transform: scale(.97); }
.iconbtn svg{ width:15px; height:15px; flex:none; }
.iconbtn--primary{
  background: var(--brand-gradient); border-color: transparent; color:#fff;
  box-shadow: var(--shadow-glow);
}
.iconbtn--primary:hover{ filter:brightness(1.06); box-shadow: 0 12px 30px -6px var(--accent-glow); }
.iconbtn--square{ padding:0; width:34px; }
.kbd{
  font-family: var(--font-ui); font-size:10.5px; color: var(--ink-3);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:5px;
  padding: 1px 5px; margin-left:2px; background:var(--surface-2);
}

/* ============================================================
   DOCK — navegação premium flutuante (14 blocos + Visão Geral)
   ============================================================ */
.dockwrap{ position:sticky; top: var(--header-h); z-index:30; padding: 10px var(--sp-5) 0; }
.dock{
  position:relative;
  height: var(--dock-h);
  border-radius: var(--r-lg);
  background: var(--glass-bg);
  backdrop-filter: blur(16px) saturate(1.5);
  -webkit-backdrop-filter: blur(16px) saturate(1.5);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-sm);
  display:flex; align-items:stretch;
}
.dock__scroll{
  flex:1 1 auto; display:flex; align-items:center; gap:4px; overflow-x:auto; scrollbar-width:none;
  -ms-overflow-style:none; scroll-behavior:smooth; padding: 6px 8px;
}
.dock__scroll::-webkit-scrollbar{ display:none; }
.dock__item{
  flex:none; display:flex; align-items:center; gap:7px; height:100%; padding:0 13px;
  font-size:12.3px; font-weight:600; color: var(--ink-2); border-radius: var(--r-md);
  cursor:pointer; white-space:nowrap; transition: background .16s var(--ease), color .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease);
  position:relative;
}
.dock__item svg{ width:15px; height:15px; flex:none; opacity:.75; transition: opacity .16s var(--ease), transform .16s var(--ease); }
.dock__item:hover{ background: var(--surface-2); color: var(--ink); }
.dock__item:hover svg{ opacity:1; transform: translateY(-1px); }
.dock__item:active{ transform: scale(.97); }
.dock__item.is-active{
  background: var(--brand-gradient); color:#fff; box-shadow: var(--shadow-glow);
}
.dock__item.is-active svg{ opacity:1; }
.dock__count{
  font-size:10px; font-weight:800; color: var(--ink-3); background: var(--surface-2); border-radius:20px; padding:1px 6px; line-height:1.5;
}
.dock__item.is-active .dock__count{ color:#fff; background: rgba(255,255,255,.26); }
.dock__count.is-late{ color: var(--danger); background: var(--danger-wash); }
.dock__item.is-active .dock__count.is-late{ color:#fff; background: rgba(255,255,255,.32); }
.dock__fade{ position:absolute; top:0; bottom:0; width:36px; pointer-events:none; z-index:2; border-radius: var(--r-lg); }
.dock__fade--l{ left:0; background: linear-gradient(90deg, var(--glass-bg-strong), transparent); }
.dock__fade--r{ right:0; background: linear-gradient(270deg, var(--glass-bg-strong), transparent); }

/* ============================================================
   MAIN
   ============================================================ */
.main{ flex:1 1 auto; width:100%; }
.container{ max-width:1280px; margin:0 auto; padding: var(--sp-6) var(--sp-5) var(--sp-8); }

.pagehead{ display:flex; align-items:flex-end; justify-content:space-between; gap: var(--sp-4); margin-bottom: var(--sp-5); flex-wrap:wrap; }
.pagehead__eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--ink-3); margin-bottom:6px; display:flex; align-items:center; gap:7px; }
.pagehead h1{ font-family:var(--font-display); font-size:25px; font-weight:800; letter-spacing:-.015em; text-wrap:balance; }
.pagehead__meta{ font-size:12.3px; color: var(--ink-3); margin-top:5px; }

/* área — badge de identidade contextual */
.areabadge{
  width:42px; height:42px; border-radius: var(--r-md); flex:none;
  display:flex; align-items:center; justify-content:center;
  background: var(--brand-gradient-soft); color: var(--accent-ink);
  border:1px solid var(--glass-border);
}
:root[data-theme="dark"] .areabadge, @media (prefers-color-scheme:dark){ .areabadge{ color: var(--accent-ink); } }
.areabadge svg{ width:21px; height:21px; }
.pageheadrow{ display:flex; align-items:center; gap: var(--sp-4); }

/* ---- HERO (Visão Geral) ---- */
.hero{
  position:relative; overflow:hidden;
  border-radius: var(--r-xl); border:1px solid var(--border);
  background: var(--surface);
  padding: var(--sp-6) var(--sp-6);
  margin-bottom: var(--sp-6);
  display:flex; align-items:center; justify-content:space-between; gap: var(--sp-6); flex-wrap:wrap;
}
.hero::before{
  content:''; position:absolute; inset:0; opacity:.85; pointer-events:none;
  background:
    radial-gradient(420px 220px at 100% 0%, color-mix(in srgb, var(--brand-3) 13%, transparent), transparent 70%),
    radial-gradient(360px 220px at 0% 120%, color-mix(in srgb, var(--brand-1) 12%, transparent), transparent 70%);
}
.hero__main{ position:relative; min-width:260px; flex:1 1 380px; }
.hero__eyebrow{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color: var(--ink-3); display:flex; align-items:center; gap:8px; }
.hero__eyebrow .liveDot{ width:6px; height:6px; border-radius:50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-wash); }
.hero__title{ font-family:var(--font-display); font-size:30px; font-weight:800; letter-spacing:-.02em; margin-top:6px; }
.hero__msg{ font-size:15px; color: var(--ink-2); margin-top:9px; max-width:52ch; line-height:1.5; }
.hero__msg b{ color:var(--ink); font-weight:700; }
.hero__msg .grad{
  background: var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800;
}
.hero__foot{ display:flex; align-items:center; gap: var(--sp-3); margin-top: var(--sp-5); flex-wrap:wrap; }
.hero__meta{ font-size:12px; color: var(--ink-3); display:flex; align-items:center; gap:6px; }
.hero__meta svg{ width:13px; height:13px; }

.hero__ring{ position:relative; flex:none; display:flex; align-items:center; justify-content:center; }
.hero__ring svg{ width:118px; height:118px; }
.hero__ring text{ display:none; }
.hero__ring .ringlabel{ position:absolute; text-align:center; }
.hero__ring .ringlabel b{ display:block; font-family:var(--font-display); font-size:22px; font-weight:800; }
.hero__ring .ringlabel span{ display:block; font-size:9.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; margin-top:1px; max-width:80px; }

/* ---- KPI bento ---- */
.kpigrid{
  display:grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto auto; gap: var(--sp-3);
  margin-bottom: var(--sp-7);
}
.kpi{
  position:relative; border-radius: var(--r-lg); border:1px solid var(--border); background: var(--surface);
  padding: var(--sp-4); cursor:pointer; transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease);
  overflow:hidden;
}
.kpi:hover{ border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.kpi.is-active{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.kpi__icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
.kpi__icon svg{ width:14px; height:14px; }
.kpi__value{ font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.01em; font-variant-numeric: tabular-nums; line-height:1; }
.kpi__label{ font-size:11px; font-weight:600; color: var(--ink-3); text-transform:uppercase; letter-spacing:.045em; margin-top:7px; }
.kpi__sub{ font-size:11px; color:var(--ink-3); margin-top:4px; }

.kpi--xl{ grid-column: span 2; grid-row: span 2; padding: var(--sp-5); background: linear-gradient(160deg, var(--surface), var(--danger-wash) 165%); }
.kpi--xl .kpi__icon{ background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger-ink); width:34px; height:34px; border-radius:10px; }
.kpi--xl .kpi__icon svg{ width:18px; height:18px; }
.kpi--xl .kpi__value{ font-size:44px; color: var(--danger-ink); }
.kpi--xl .kpi__label{ font-size:12px; }
.kpi--lg{ grid-column: span 2; }
.kpi--lg .kpi__icon{ background: var(--accent-wash); color: var(--accent-ink); }
.kpi--sm{ grid-column: span 2; }
.kpi--sm .kpi__icon{ background: var(--surface-2); color: var(--ink-2); }
.kpi--warn .kpi__icon{ background: var(--warning-wash); color: var(--warning-ink); }
.kpi--ok .kpi__icon{ background: var(--success-wash); color: var(--success-ink); }
@media (max-width: 1180px){ .kpigrid{ grid-template-columns: repeat(4,1fr); } .kpi--xl{ grid-column: span 2; grid-row:span 1; } }
@media (max-width: 700px){ .kpigrid{ grid-template-columns: repeat(2,1fr); } .kpi--xl{ grid-column: span 2; } .kpi--lg{ grid-column:span 1; } .kpi--sm{ grid-column:span 1; } }

/* ---- timeline horizontal de prazos ---- */
.dltimeline{ display:flex; gap: var(--sp-2); overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.dltimeline::-webkit-scrollbar{ display:none; }
.dlday{
  flex:none; min-width:92px; border-radius: var(--r-md); border:1px solid var(--border); background:var(--surface);
  padding: var(--sp-3); cursor:pointer; transition: all .15s var(--ease); text-align:center;
}
.dlday:hover{ border-color: var(--border-strong); transform:translateY(-2px); }
.dlday.is-active{ background: var(--brand-gradient); border-color:transparent; box-shadow: var(--shadow-glow); }
.dlday.is-active .dlday__label, .dlday.is-active .dlday__count{ color:#fff; }
.dlday.is-today{ border-color: var(--accent); }
.dlday__label{ font-size:10.5px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
.dlday__count{ font-family:var(--font-display); font-size:22px; font-weight:800; margin-top:6px; color:var(--ink); }
.dlday__bar{ height:3px; border-radius:2px; background:var(--surface-3); margin-top:8px; overflow:hidden; }
.dlday__bar i{ display:block; height:100%; background: var(--brand-gradient); border-radius:2px; }
.dlday.is-active .dlday__bar{ background: rgba(255,255,255,.3); }
.dlday.is-active .dlday__bar i{ background:#fff; }

/* ---- filter bar / chips ---- */
.filterbar{ display:flex; align-items:center; gap: var(--sp-2); flex-wrap:wrap; margin-bottom: var(--sp-4); }
.chip{
  display:inline-flex; align-items:center; gap:6px; height:31px; padding:0 13px;
  border-radius: var(--r-pill); border:1px solid var(--border); background: var(--surface);
  font-size:12px; font-weight:600; color: var(--ink-2); cursor:pointer;
  transition: all .14s var(--ease); user-select:none;
}
.chip:hover{ border-color: var(--border-strong); color: var(--ink); }
.chip.is-active{ background: var(--ink); border-color: var(--ink); color: var(--ink-inverse); }
.filterbar__sep{ width:1px; align-self:stretch; background:var(--border); margin:0 2px; }
.select{
  height:31px; border-radius: var(--r-pill); border:1px solid var(--border); background: var(--surface);
  font-size:12px; font-weight:600; color: var(--ink-2); padding:0 26px 0 13px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%238C877C" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  background-repeat:no-repeat; background-position: right 10px center;
}
.select:hover{ border-color:var(--border-strong); }

/* ---- segmented control (Financeiro) ---- */
.segctrl{ display:inline-flex; gap:2px; background:var(--surface-2); padding:3px; border-radius: var(--r-pill); border:1px solid var(--border); }
.segctrl__item{
  padding:8px 16px; border-radius: var(--r-pill); font-size:12.3px; font-weight:700; color:var(--ink-2); cursor:pointer;
  transition: all .18s var(--ease); position:relative; white-space:nowrap;
}
.segctrl__item.is-active{ background: var(--surface); color:var(--ink); box-shadow: var(--shadow-sm); }
.segctrl__item:not(.is-active):hover{ color:var(--ink); }

/* ---- table ---- */
.tablewrap{ border:1px solid var(--border); border-radius: var(--r-lg); overflow:hidden; background:var(--surface); box-shadow: var(--shadow-xs); }
table.tasktable{ width:100%; border-collapse:collapse; }
.tasktable thead th{
  text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color: var(--ink-3); padding:11px var(--sp-4); border-bottom:1px solid var(--border); background:var(--surface-2);
  white-space:nowrap;
}
.tasktable tbody tr{ border-bottom:1px solid var(--border); cursor:pointer; transition: background .12s var(--ease); position:relative; }
.tasktable tbody tr:last-child{ border-bottom:none; }
.tasktable tbody tr:hover{ background: var(--surface-2); }
.tasktable tbody tr::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition: background .12s var(--ease); }
.tasktable tbody tr:hover::before{ background: var(--brand-gradient); }
.tasktable td{ padding:12px var(--sp-4); vertical-align:top; font-size:12.8px; }
.td-title{ max-width:420px; }
.td-title .unidade{ font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color: var(--accent-ink); margin-bottom:3px; }
.td-title .titulo{ color:var(--ink); font-weight:500; line-height:1.4; }
.td-title .flags{ margin-top:4px; display:flex; gap:6px; }
.flag{ font-size:10px; color:var(--warning-ink); display:inline-flex; align-items:center; gap:3px; font-weight:600; }
.muted{ color:var(--ink-3); }
.td-nowrap{ white-space:nowrap; }

.avatar{
  width:22px; height:22px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center;
  font-size:9.5px; font-weight:800; color:#fff; letter-spacing:0;
}
.avatarrow{ display:flex; align-items:center; gap:7px; }

.badge{
  display:inline-flex; align-items:center; gap:5px; height:23px; padding:0 9px; border-radius: var(--r-pill);
  font-size:11px; font-weight:700; letter-spacing:.01em; white-space:nowrap;
  background: var(--neutral-chip); color: var(--ink-2);
}
.badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
.badge--porIniciar{ background: var(--neutral-chip); color: var(--ink-2); }
.badge--emCurso{ background: var(--accent-wash); color: var(--accent-ink); }
.badge--aAguardar{ background: var(--warning-wash); color: var(--warning-ink); }
.badge--bloqueado{ background: var(--danger-wash); color: var(--danger-ink); }
.badge--concluido{ background: var(--success-wash); color: var(--success-ink); }
.badge--cancelado{ background: var(--surface-3); color: var(--ink-3); text-decoration:line-through; }
.badge--atraso{ background: var(--danger-wash); color: var(--danger-ink); }
.badge-prio{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.badge-prio--critica{ color: var(--danger-ink); }
.badge-prio--alta{ color: var(--warning-ink); }
.badge-prio--media, .badge-prio--baixa{ color: var(--ink-3); }

/* empty state */
.emptystate{ padding: var(--sp-8) var(--sp-5); text-align:center; color: var(--ink-3); }
.emptystate b{ display:block; color:var(--ink-2); font-size:14px; margin-bottom:4px; }

/* mobile task cards */
.taskcards{ display:none; flex-direction:column; gap: var(--sp-2); }
.taskcard{ border:1px solid var(--border); border-radius: var(--r-lg); background:var(--surface); padding: var(--sp-3) var(--sp-4); cursor:pointer; transition: transform .12s var(--ease), border-color .12s var(--ease); }
.taskcard:active{ transform: scale(.985); }
.taskcard__top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.taskcard .unidade{ font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color: var(--accent-ink); margin-bottom:3px; }
.taskcard .titulo{ font-size:13.3px; font-weight:500; line-height:1.4; }
.taskcard__foot{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.taskcard__prazo{ font-size:11.5px; color: var(--ink-3); font-weight:600; }
.taskcard__area{ font-size:10.5px; color:var(--ink-3); margin-top:2px; }
.taskcard__nome{ font-size:11.5px; color: var(--ink-2); font-weight:600; margin-left:auto; }

/* section title used in overview */
.sec{ margin-bottom: var(--sp-7); }
.sec__head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--sp-3); }
.sec__title{ font-family:var(--font-display); font-size:15.5px; font-weight:800; letter-spacing:-.005em; display:flex; align-items:center; gap:9px; }
.sec__title .n{ font-size:11px; font-weight:700; color:var(--ink-3); background:var(--surface-2); border-radius:20px; padding:1px 7px; font-family:var(--font-ui); }
.sec__title .dot{ width:8px; height:8px; border-radius:50%; }
.sec__link{ font-size:12px; font-weight:700; color: var(--accent-ink); cursor:pointer; }
.sec__link:hover{ text-decoration:underline; }

.grid-overview{ display:grid; grid-template-columns: 1.4fr 1fr; gap: var(--sp-6); align-items:start; min-width:0; }
.grid-overview > div{ min-width:0; }
@media (max-width: 980px){ .grid-overview{ grid-template-columns:1fr; } }

.list-compact{ border:1px solid var(--border); border-radius: var(--r-lg); background:var(--surface); overflow:hidden; min-width:0; box-shadow: var(--shadow-xs); }
.list-compact__row{ display:flex; align-items:center; gap: var(--sp-3); padding: 11px var(--sp-4); border-bottom:1px solid var(--border); cursor:pointer; min-width:0; transition: background .12s var(--ease); }
.list-compact__row:last-child{ border-bottom:none; }
.list-compact__row:hover{ background:var(--surface-2); }
.list-compact__main{ flex:1 1 auto; min-width:0; }
.list-compact__main .titulo{ font-size:12.6px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-compact__main .sub{ font-size:11px; color:var(--ink-3); margin-top:3px; display:flex; gap:6px; align-items:center; }
.list-compact__side{ flex:none; text-align:right; font-size:11px; color:var(--ink-3); font-weight:700; }

/* ---- área — cards redesenhados ---- */
.areagrid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap: var(--sp-3); }
.areacard{
  position:relative; border-radius: var(--r-lg); border:1px solid var(--border); background: var(--surface);
  padding: var(--sp-4); cursor:pointer; transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease);
  overflow:hidden;
}
.areacard:hover{ border-color: var(--border-strong); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.areacard__top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--sp-4); }
.areacard__icon{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; background: var(--surface-2); color:var(--ink-2); }
.areacard__icon svg{ width:16px; height:16px; }
.areacard.has-late .areacard__icon{ background: var(--danger-wash); color:var(--danger-ink); }
.areacard__title{ font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:.002em; margin-bottom:12px; min-height:34px; text-wrap:balance; }
.areacard__bar{ height:5px; border-radius:3px; background: var(--surface-3); overflow:hidden; display:flex; margin-bottom:10px; }
.areacard__bar i{ display:block; height:100%; }
.areacard__stats{ display:flex; gap: var(--sp-4); }
.areacard__stat b{ display:block; font-family:var(--font-display); font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.areacard__stat span{ font-size:9.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; }
.areacard__stat.c-danger b{ color:var(--danger-ink); }

/* ---- distribuição / volume (data viz custom, sem libs) ---- */
.vizrow{ display:grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); margin-bottom: var(--sp-7); }
@media (max-width: 980px){ .vizrow{ grid-template-columns:1fr; } }
.vizcard{ border:1px solid var(--border); border-radius: var(--r-lg); background:var(--surface); padding: var(--sp-5); box-shadow: var(--shadow-xs); }
.donut{ display:flex; align-items:center; gap: var(--sp-5); }
.donut svg{ flex:none; }
.donutlegend{ display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
.donutlegend__row{ display:flex; align-items:center; gap:8px; font-size:12px; }
.donutlegend__row i{ width:8px; height:8px; border-radius:2px; flex:none; }
.donutlegend__row b{ margin-left:auto; font-variant-numeric:tabular-nums; }
.volbars{ display:flex; flex-direction:column; gap:10px; }
.volbar__row{ display:grid; grid-template-columns: 132px 1fr 28px; align-items:center; gap:10px; cursor:pointer; }
.volbar__label{ font-size:11.6px; font-weight:600; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.volbar__track{ height:8px; border-radius:5px; background: var(--surface-2); overflow:hidden; }
.volbar__fill{ height:100%; border-radius:5px; background: var(--brand-gradient); transition: width .5s var(--ease-soft); }
.volbar__count{ font-size:11.5px; font-weight:700; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums; }

/* ---- drawer ---- */
.overlay{ position:fixed; inset:0; background: rgba(12,11,16,.42); backdrop-filter: blur(2px); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s var(--ease); }
.overlay.is-open{ opacity:1; pointer-events:auto; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); background: var(--surface); z-index:61;
  box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .32s var(--ease);
  display:flex; flex-direction:column; border-left:1px solid var(--border);
}
.drawer.is-open{ transform:translateX(0); }
.drawer__head{ padding: var(--sp-5); border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:var(--sp-3); background: var(--surface-2); }
.drawer__head .areabadge{ width:38px; height:38px; }
.drawer__head .areabadge svg{ width:19px; height:19px; }
.drawer__headtext{ flex:1; min-width:0; }
.drawer__head .unidade{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); }
.drawer__head h2{ font-family:var(--font-display); font-size:17px; font-weight:800; line-height:1.3; margin-top:4px; text-wrap:balance; }
.drawer__close{ flex:none; }
.drawer__body{ flex:1 1 auto; overflow-y:auto; padding: var(--sp-5); }
.drawer__foot{ border-top:1px solid var(--border); padding: var(--sp-4) var(--sp-5); }
.dl{ display:grid; grid-template-columns: 104px 1fr; gap:11px 12px; margin-bottom: var(--sp-5); align-items:center; }
.dl dt{ font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; }
.dl dd{ margin:0; font-size:12.8px; color:var(--ink); }
.dl select, .dl input[type=text], .dl textarea{
  width:100%; border:1px solid var(--border); border-radius: var(--r-sm); background:var(--surface-2);
  font-family:inherit; font-size:12.6px; padding:7px 9px; color:var(--ink); transition: border-color .12s var(--ease), background .12s var(--ease);
}
.dl select:hover, .dl input[type=text]:hover, .dl textarea:hover{ border-color:var(--border-strong); }
.dl select:focus, .dl input[type=text]:focus, .dl textarea:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
.dl textarea{ resize:vertical; min-height:56px; }
.selstatus{ font-weight:700; }
.drawer__section{ margin-bottom: var(--sp-5); }
.drawer__section h3{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin-bottom:9px; }
.timeline{ display:flex; flex-direction:column; gap:0; }
.timeline__item{ position:relative; padding-left:17px; padding-bottom:15px; border-left:1.5px solid var(--border); }
.timeline__item:last-child{ border-color:transparent; padding-bottom:0; }
.timeline__item::before{ content:''; position:absolute; left:-4.5px; top:3px; width:8px; height:8px; border-radius:50%; background: var(--brand-gradient); box-shadow: 0 0 0 3px var(--surface); }
.timeline__date{ font-size:10.5px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; }
.timeline__evt{ font-size:12.3px; color:var(--ink); margin-top:2px; }
.origin-box{ background:var(--surface-2); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size:12px; color:var(--ink-2); border:1px solid var(--border); }
.origin-box b{ color:var(--ink); }

/* ---- modal ---- */
.modal{
  position:fixed; z-index:70; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center;
  padding: var(--sp-5); opacity:0; pointer-events:none; transition:opacity .16s var(--ease);
}
.modal.is-open{ opacity:1; pointer-events:auto; }
.modal__backdrop{ position:absolute; inset:0; background: rgba(12,11,16,.46); backdrop-filter: blur(3px); }
.modal__panel{
  position:relative; background: var(--glass-bg-strong); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-radius: var(--r-xl); box-shadow: var(--shadow-lg); border:1px solid var(--glass-border);
  width:100%; max-width:560px; max-height:min(680px,86vh); display:flex; flex-direction:column;
  transform: translateY(10px) scale(.97); transition: transform .24s var(--ease);
}
.modal.is-open .modal__panel{ transform:none; }
.modal__panel--wide{ max-width:760px; }
.modal__head{ padding: var(--sp-5) var(--sp-5) var(--sp-4); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-3); }
.modal__head h2{ font-family:var(--font-display); font-size:17px; font-weight:800; }
.modal__head p{ font-size:12.3px; color:var(--ink-3); margin-top:4px; }
.modal__headicon{ width:36px; height:36px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background: var(--brand-gradient); color:#fff; }
.modal__headicon svg{ width:18px; height:18px; }
.modal__body{ padding: var(--sp-5); overflow-y:auto; flex:1 1 auto; }
.modal__foot{ padding: var(--sp-4) var(--sp-5); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap: var(--sp-2); }

.dropzone{
  border:1.5px dashed var(--border-strong); border-radius: var(--r-lg); padding: var(--sp-7) var(--sp-5);
  text-align:center; cursor:pointer; transition: border-color .18s var(--ease), background .18s var(--ease); background: var(--surface);
}
.dropzone:hover, .dropzone.is-drag{ border-color: var(--accent); background: var(--accent-wash); }
.dropzone__icon{ width:52px; height:52px; border-radius:14px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; background: var(--brand-gradient-soft); color:var(--accent-ink); }
.dropzone__icon svg{ width:24px; height:24px; }
.dropzone b{ display:block; font-size:13.8px; margin-bottom:4px; }
.dropzone span{ font-size:12px; color:var(--ink-3); }

.spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); margin:0 auto 16px; animation: fffSpin .8s linear infinite; }

.previewstats{ display:grid; grid-template-columns:repeat(3,1fr); gap: var(--sp-2); margin: var(--sp-4) 0; }
.previewstats .ps{ background:var(--surface); border:1px solid var(--border); border-radius: var(--r-md); padding: var(--sp-3); text-align:center; }
.previewstats .ps svg{ width:15px; height:15px; margin:0 auto 6px; }
.previewstats .ps b{ display:block; font-family:var(--font-display); font-size:20px; font-weight:800; }
.previewstats .ps span{ font-size:9.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; }

.difflist{ display:flex; flex-direction:column; gap: var(--sp-2); }
.diffrow{ border:1px solid var(--border); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); background:var(--surface); }
.diffrow__tag{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:5px; padding:2px 7px; margin-bottom:7px; }
.diffrow__tag--novo{ background:var(--success-wash); color:var(--success-ink); }
.diffrow__tag--atualizado{ background:var(--accent-wash); color:var(--accent-ink); }
.diffrow__tag--ausente{ background:var(--warning-wash); color:var(--warning-ink); }
.diffrow__title{ font-size:12.6px; color:var(--ink); font-weight:500; margin-bottom:4px; }
.diffrow__change{ font-size:11.8px; color:var(--ink-2); display:flex; gap:6px; align-items:center; }
.diffrow__change .before{ color:var(--ink-3); text-decoration:line-through; }
.diffrow__change .after{ color:var(--ink); font-weight:600; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; height:37px; padding:0 17px;
  border-radius: var(--r-sm); border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:12.8px; font-weight:600; cursor:pointer; transition: all .14s var(--ease);
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform: scale(.97); }
.btn--primary{ background: var(--brand-gradient); border-color: transparent; color:#fff; box-shadow: var(--shadow-glow); }
.btn--primary:hover{ filter:brightness(1.06); }
.btn--ghost{ border-color:transparent; background:transparent; }
.btn--ghost:hover{ background:var(--surface-2); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---- financeiro ---- */
.finprep{ display:grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: var(--sp-3); }
.finprep__card{ border:1px solid var(--border); border-radius: var(--r-lg); background:var(--surface); padding: var(--sp-4); }
.finprep__card__top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.finprep__card__top svg{ width:14px; height:14px; color: var(--ink-3); }
.finprep__card b{ font-size:12.3px; font-weight:700; display:block; }
.finprep__card .val{ font-family:var(--font-display); font-size:19px; font-weight:800; color:var(--ink-3); margin-top:10px; }

/* ---- DRE Campo de Ourique — dados reais (screenshot) ---- */
.drekpis{ display:grid; grid-template-columns: repeat(4,1fr); gap: var(--sp-3); margin-bottom: var(--sp-5); }
@media (max-width: 860px){ .drekpis{ grid-template-columns: repeat(2,1fr); } }
.drekpi{ border:1px solid var(--border); border-radius: var(--r-lg); background:var(--surface); padding: var(--sp-4); }
.drekpi span{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); }
.drekpi b{ display:block; font-family:var(--font-display); font-size:19px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }
.drekpi b.c-pos{ color:var(--success-ink); }
.drekpi b.c-neg{ color:var(--danger-ink); }
.dre-legend{ display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
.dre-legend__row{ display:flex; align-items:center; gap:7px; font-size:11.6px; font-weight:600; color:var(--ink-2); }
.dre-legend__row i{ width:9px; height:9px; border-radius:2.5px; flex:none; }
.drechart{ display:flex; align-items:flex-end; gap:8px; overflow-x:auto; padding: 2px 2px 0; scrollbar-width:none; }
.drechart::-webkit-scrollbar{ display:none; }
.drechart__col{ display:flex; flex-direction:column; align-items:center; min-width:42px; flex:1; }
.drechart__bars{ display:flex; gap:3px; align-items:flex-end; justify-content:center; height:158px; width:100%; }
.drechart__bar{ width:11px; border-radius:3px 3px 0 0; min-height:2px; transition: height .4s var(--ease-soft); cursor:default; }
.drechart__bar--receita{ background: var(--accent); }
.drechart__bar--opex{ background: var(--ink-3); }
.drechart__label{ font-size:9.5px; color:var(--ink-3); margin-top:8px; white-space:nowrap; font-weight:600; }
.drediv{ display:flex; align-items:stretch; gap:8px; overflow-x:auto; padding: 2px 2px 0; scrollbar-width:none; }
.drediv::-webkit-scrollbar{ display:none; }
.drediv__col{ display:flex; flex-direction:column; align-items:center; min-width:42px; flex:1; }
.drediv__stack{ display:flex; flex-direction:column; height:150px; width:100%; }
.drediv__top{ height:75px; display:flex; align-items:flex-end; justify-content:center; }
.drediv__bottom{ height:75px; display:flex; align-items:flex-start; justify-content:center; border-top:1.5px solid var(--border-strong); }
.drediv__bar{ width:15px; min-height:2px; cursor:default; }
.drediv__bar--pos{ background: var(--success); border-radius:3px 3px 0 0; }
.drediv__bar--neg{ background: var(--danger); border-radius:0 0 3px 3px; }
.drediv__label{ font-size:9.5px; color:var(--ink-3); margin-top:8px; white-space:nowrap; font-weight:600; }
.dre-origin{ font-size:11.5px; color:var(--ink-3); margin-top: var(--sp-2); }
.dretable-wrap{ overflow-x:auto; }
table.dretable{ width:100%; border-collapse:collapse; min-width:640px; }
table.dretable th{ text-align:right; font-size:10.3px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); padding:9px 12px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
table.dretable th:first-child{ text-align:left; }
table.dretable td{ text-align:right; padding:8px 12px; font-size:12.4px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; white-space:nowrap; }
table.dretable td:first-child{ text-align:left; font-weight:600; color:var(--ink); }
table.dretable tr:last-child td{ border-bottom:none; }
table.dretable tr.is-total td{ font-weight:800; background:var(--surface-2); border-top:1.5px solid var(--border-strong); }
table.dretable td.c-pos{ color:var(--success-ink); }
table.dretable td.c-neg{ color:var(--danger-ink); }

/* ---- gráficos genéricos (linhas / barras agrupadas reutilizáveis) ---- */
.linechart-wrap{ overflow-x:auto; padding: 2px 2px 0; scrollbar-width:none; }
.linechart-wrap::-webkit-scrollbar{ display:none; }
.linechart-wrap svg text{ font-family: var(--font-ui); fill: var(--ink-3); }
.hl-pos{ background: color-mix(in srgb, var(--success) 22%, transparent) !important; color: var(--success-ink) !important; font-weight:800 !important; }
.hl-neg{ background: color-mix(in srgb, var(--danger) 20%, transparent) !important; color: var(--danger-ink) !important; font-weight:800 !important; }
.subvizhead{ font-size:12.5px; font-weight:700; color:var(--ink-2); margin: var(--sp-5) 0 10px; }
.dre-note{ font-size:11.5px; color:var(--ink-3); margin-top: var(--sp-2); }

/* ---- barra de proporção (split bar) — composição de um total em duas partes ---- */
.splitbar{ display:flex; height:36px; border-radius: var(--r-md); overflow:hidden; border:1px solid var(--border); }
.splitbar__seg{ display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:#fff; white-space:nowrap; min-width:0; }
.splitbar__seg--a{ background: var(--accent); }
.splitbar__seg--b{ background: var(--ink-3); }
.splitbar__legend{ display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; color:var(--ink-2); }
.splitbar__legend b{ font-weight:700; color:var(--ink); }

/* ---- search / command palette ---- */
.searchbox{ display:flex; align-items:center; gap:12px; padding: 0 var(--sp-5); height:56px; border-bottom:1px solid var(--border); }
.searchbox svg{ width:18px; height:18px; color:var(--ink-3); flex:none; }
.searchbox input{ flex:1; border:none; outline:none; background:transparent; font-size:15.5px; color:var(--ink); font-family:inherit; }
.searchresults{ max-height:56vh; overflow-y:auto; padding: 6px; }
.searchgrouplabel{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); padding: 10px 12px 6px; }
.searchresult{ display:flex; align-items:center; gap:11px; padding: 10px 12px; cursor:pointer; border-radius: var(--r-sm); }
.searchresult.is-selected, .searchresult:hover{ background: var(--surface-2); }
.searchresult__icon{ width:28px; height:28px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-2); }
.searchresult.is-selected .searchresult__icon, .searchresult:hover .searchresult__icon{ background: var(--brand-gradient); color:#fff; }
.searchresult__icon svg{ width:14px; height:14px; }
.searchresult__main{ flex:1; min-width:0; }
.searchresult__title{ font-size:12.8px; font-weight:500; }
.searchresult__meta{ font-size:11px; color:var(--ink-3); margin-top:2px; }
mark{ background: var(--accent-wash-strong); color: var(--accent-ink); border-radius:2px; padding:0 1px; }

/* ---- toast ---- */
.toast{ position:fixed; bottom: var(--sp-6); left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--ink-inverse); padding:11px 20px; border-radius: var(--r-pill); font-size:12.6px; font-weight:600; box-shadow:var(--shadow-lg); z-index:90; opacity:0; pointer-events:none; transition: all .2s var(--ease); display:flex; align-items:center; gap:9px; }
.toast.is-open{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast svg{ width:14px; height:14px; color: var(--success); flex:none; }

/* ---- config panel ---- */
.confrow{ display:flex; align-items:center; justify-content:space-between; padding: var(--sp-3) 0; border-bottom:1px solid var(--border); gap:var(--sp-4); }
.confrow:last-child{ border-bottom:none; }
.confrow__label b{ display:block; font-size:12.8px; }
.confrow__label span{ font-size:11.5px; color:var(--ink-3); }

/* ---- mobile dock (bottom nav flutuante) ---- */
.bottomnav{ display:none; position:fixed; left:0; right:0; bottom:0; z-index:35; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); }
.bottomnav__row{
  display:flex; background: var(--glass-bg-strong); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
  border:1px solid var(--glass-border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding:5px;
}
.bottomnav__item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; color:var(--ink-3); cursor:pointer; border-radius: var(--r-md); transition: all .16s var(--ease); }
.bottomnav__item.is-active{ color: #fff; background: var(--brand-gradient); box-shadow: var(--shadow-glow); }
.bottomnav__item svg{ width:19px; height:19px; }
.bottomnav__item span{ font-size:9.5px; font-weight:700; }

.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:65; background:var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg); transform: translateY(100%); transition: transform .28s var(--ease); max-height:82vh; display:flex; flex-direction:column; border-top:1px solid var(--border); }
.sheet.is-open{ transform:translateY(0); }
.sheet__handle{ width:36px; height:4px; border-radius:99px; background: var(--border-strong); margin: 10px auto 4px; flex:none; }
.sheet__head{ padding: var(--sp-2) var(--sp-5) var(--sp-3); font-family:var(--font-display); font-size:15.5px; font-weight:800; }
.sheet__body{ overflow-y:auto; padding: 0 var(--sp-4) var(--sp-6); }
.sheet__item{ padding: 12px 10px; border-radius: var(--r-md); font-size:13.5px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.sheet__item:hover{ background:var(--surface-2); }
.sheet__item__left{ display:flex; align-items:center; gap:11px; min-width:0; }
.sheet__item__icon{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background: var(--surface-2); color: var(--ink-2); }
.sheet__item__icon svg{ width:15px; height:15px; }

@media (max-width: 860px){
  .header{ padding: 0 var(--sp-4); gap: var(--sp-3); }
  .header__brandtext{ display:none; }
  .dockwrap{ display:none; }
  .container{ padding: var(--sp-4) var(--sp-4) 112px; }
  .pagehead h1{ font-size:21px; }
  .kpigrid{ margin-bottom: var(--sp-6); }
  .tablewrap{ display:none; }
  .taskcards{ display:flex; }
  .grid-overview{ gap: var(--sp-5); }
  .bottomnav{ display:block; }
  .drawer{ width:100vw; }
  .iconbtn span.lbl{ display:none; }
  .header__actions .lbl-hide-mobile{ display:none; }
  .searchtrigger .kbd, .searchtrigger span.lbl{ display:none; }
  .hero{ padding: var(--sp-5); }
  .hero__ring{ display:none; }
  .hero__title{ font-size:24px; }
}
@media (min-width:861px){
  .bottomnav{ display:none !important; }
}
</style>
</head>

var NOMES_CONHECIDOS = new Set([
  "Matheus","Simone","Camila","Rui","Pablo","Rodrigo","Helena","Diego","Nelson",
  "Rafael","Raoni","Hugo","Sara","Deborah","Yasmin","Raul","André","Andrea",
  "Aguilar","Reginaldo","Marcelo","Bernardo","Carlos","Deia","Suzy","Bruna",
  "Binho","Fabiana","Thales","Giovanna","Tomaz","Carol","Katarina","Patrícia",
  "João","Mafalda","Marlos","Eduardo","Isa","Rita"
].map(function(n){return n.toUpperCase();}));

function stripBold(s){ return s.replace(/\*\*/g,""); }
function normalizeHeader(s){
  return stripBold(s).replace(/^-+\s*/,"").replace(/[:•]+\s*$/g,"").replace(/\s+/g," ").trim().toUpperCase();
}
function simpleHash(str){
  var h=0;
  for(var i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function extractUnidade(text){
  var re=/^(CAMPO DE OURIQUE|SALDANHA|FFF|CASCAIS)\s*\|\s*/i;
  var m=text.match(re);
  if(!m) return {unidade:"",resto:text};
  var unidade = UNIDADES_CONHECIDAS.find(function(u){return u.toUpperCase()===m[1].toUpperCase();});
  return {unidade:unidade,resto:text.slice(m[0].length)};
}
function extractPrazo(text, ano){
  var re=/^(\d{2})\/(\d{2})\s*(:)?\s*/;
  var m=text.match(re);
  if(!m) return {prazo:null,resto:text,reverInformacao:false};
  var dd=m[1], mm=m[2];
  var separadorAusente = !m[3] && m[0].length<=5;
  return {prazo: ano+"-"+mm+"-"+dd, resto:text.slice(m[0].length), reverInformacao:separadorAusente};
}
function extractResponsavel(text){
  var parenMatch = text.match(/\(([^)]{2,30})\)\s*\.?$/);
  if(parenMatch){
    var cand = parenMatch[1].trim();
    var m = cand.match(/^(Dr\.?\s*)?([A-ZÀ-Ý][a-zà-ÿ.]+)(\s[A-ZÀ-Ý][a-zà-ÿ.]+){0,2}$/);
    if(m && NOMES_CONHECIDOS.has(m[2].toUpperCase())) return cand;
  }
  var dashMatch = text.match(/-\s*([A-ZÀ-Ý][a-zà-ÿ]+)\.\s*$/);
  if(dashMatch && NOMES_CONHECIDOS.has(dashMatch[1].toUpperCase())) return dashMatch[1].trim();
  return "";
}
function cleanTitulo(text){
  return text.replace(/^[:\s]+/,"").replace(/\s+/g," ").replace(/\.+$/,"").trim();
}
function chavePauta(area, unidade, titulo){
  var prefixo = normalizeTxt(titulo).replace(/[^a-z0-9\s]/g,"").trim().split(/\s+/).slice(0,6).join(" ");
  return simpleHash(area+"|"+unidade+"|"+prefixo);
}
function parseLinhas(linhas, ctx){
  var areasSet = new Set(AREAS_OFICIAIS.map(function(a){return a.toUpperCase();}));
  var areaAtual = null, itens = [];
  for(var li=0; li<linhas.length; li++){
    var linha = (linhas[li]||"").trim();
    if(!linha) continue;
    var headerNorm = normalizeHeader(linha);
    if(areasSet.has(headerNorm)){
      areaAtual = AREAS_OFICIAIS.find(function(a){return a.toUpperCase()===headerNorm;});
      continue;
    }
    if(!areaAtual) continue;
    var texto = stripBold(linha).replace(/^-+\s*/,"").trim();
    if(!texto) continue;
    var u = extractUnidade(texto);
    var pz = extractPrazo(u.resto, ctx.anoReferencia);
    var responsavel = extractResponsavel(pz.resto);
    var titulo = cleanTitulo(pz.resto);
    if(!titulo) continue;
    var id = chavePauta(areaAtual, u.unidade||"", titulo);
    // Um prazo já muito anterior à própria data da pauta (mais de 14 dias) é
    // indício de erro de data/informação desatualizada no documento — não é
    // corrigido silenciosamente (não sabemos qual seria a data certa), mas
    // também não é contabilizado como "em atraso" sem revisão humana.
    var prazoMuitoAntigo = false;
    if(pz.prazo && ctx.dataImportacao){
      var diasAntesDaPauta = Math.round((new Date(ctx.dataImportacao+"T00:00:00") - new Date(pz.prazo+"T00:00:00"))/86400000);
      if(diasAntesDaPauta > 14) prazoMuitoAntigo = true;
    }
    itens.push({
      id: id, area: areaAtual, unidade: u.unidade||"", titulo: titulo,
      prazo: pz.prazo||null, responsavel: responsavel||"", status:"POR INICIAR",
      prioridade:"", tipo:"", produto:"", descricao:"", aguardandoQuem:"",
      dependencias:"", observacoes:"", reverInformacao: !!pz.reverInformacao || prazoMuitoAntigo,
      naoEncontradoNaPautaAtual:false,
      origem:{pauta:ctx.origemPauta, ficheiro:ctx.origemFicheiro, areaOriginal:areaAtual},
      dataCriacao:ctx.dataImportacao, ultimaAtualizacao:ctx.dataImportacao,
      textoOriginal: linha,
      historico:[{data:ctx.dataImportacao, evento:"Tarefa criada a partir da pauta."}]
    });
  }
  return itens;
}

var PALAVRAS_CONCLUSAO = /finalizad[oa]|conclu[ií]d[oa]|implementad[oa]|resolvid[oa]|entregue|normalizad[oa]/i;
var STOPWORDS_PT = new Set(["de","da","do","das","dos","para","com","uma","um","no","na","nos","nas",
  "que","os","as","e","a","o","em","ao","aos","à","as","por","sobre","entre","the","the","à","às",
  "se","the","seu","sua","seus","suas","ou","como","já","não","sem","até","mais","muito"]);
function tituloTokens(s){
  var arr = normalizeTxt(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(function(w){
    return w.length>=3 && !STOPWORDS_PT.has(w);
  });
  return new Set(arr);
}
function overlapScore(setA, setB){
  var inter=0;
  setA.forEach(function(w){ if(setB.has(w)) inter++; });
  var union = setA.size + setB.size - inter;
  return union ? {score: inter/union, inter:inter} : {score:0, inter:0};
}

function compararImportacao(tarefasAtuais, itensNovos){
  var mapAtuais = {};
  tarefasAtuais.forEach(function(t){ mapAtuais[t.id]=t; });
  var mapNovos = {};
  itensNovos.forEach(function(it){ mapNovos[it.id]=it; });

  var novos=[], atualizados=[], naoEncontrados=[];
  var novosSemMatch = []; // candidatos a "novo" que ainda não têm par confirmado

  itensNovos.forEach(function(novo){
    var atual = mapAtuais[novo.id];
    if(!atual){ novosSemMatch.push(novo); return; }
    var campos=[];
    if(atual.titulo !== novo.titulo) campos.push({campo:"Texto", antes:atual.titulo, depois:novo.titulo});
    if((atual.prazo||"") !== (novo.prazo||"")) campos.push({campo:"Prazo", antes: atual.prazo?formatDateBR(atual.prazo):"—", depois: novo.prazo?formatDateBR(novo.prazo):"—"});
    if((atual.unidade||"") !== (novo.unidade||"")) campos.push({campo:"Unidade", antes: atual.unidade||"—", depois: novo.unidade||"—"});
    if(novo.responsavel && novo.responsavel !== atual.responsavel) campos.push({campo:"Responsável", antes: atual.responsavel||"—", depois: novo.responsavel});
    // Só sugere conclusão quando o TEXTO mudou e passou a conter linguagem de
    // conclusão — evita repetir a mesma sugestão em todas as importações
    // seguintes só porque a redação antiga já continha essa palavra.
    var textoMudou = campos.some(function(c){return c.campo==="Texto";});
    var sugestaoConclusao = textoMudou && PALAVRAS_CONCLUSAO.test(novo.titulo) && atual.status!=="CONCLUÍDO";
    if(campos.length || atual.naoEncontradoNaPautaAtual || sugestaoConclusao){
      atualizados.push({tipo:"atualizado", atual:atual, novo:novo, camposAlterados:campos, sugestaoConclusao: !!sugestaoConclusao, reencontrado: !!atual.naoEncontradoNaPautaAtual});
    }
  });

  // Tarefas existentes sem correspondência direta por chave.
  var idsAtualizados = new Set(atualizados.map(function(a){return a.atual.id;}));
  var atuaisSemMatch = tarefasAtuais.filter(function(t){
    return !mapNovos[t.id] && !idsAtualizados.has(t.id) && !isConcluidoOuCancelado(t);
  });

  // Correspondência aproximada (texto reescrito na mesma área): evita tratar
  // como "novo item" uma tarefa que só teve a redação alterada — ex.:
  // "finalizar contrato social" -> "contrato social finalizado" (§17).
  var pares = [];
  novosSemMatch.forEach(function(novo, i){
    var tokensNovo = tituloTokens(novo.titulo);
    atuaisSemMatch.forEach(function(atual, j){
      if(atual.area !== novo.area) return;
      var r = overlapScore(tokensNovo, tituloTokens(atual.titulo));
      if(r.score >= 0.34 && r.inter >= 2){
        pares.push({i:i, j:j, score:r.score, novo:novo, atual:atual});
      }
    });
  });
  pares.sort(function(a,b){ return b.score - a.score; });
  var novoUsado = new Set(), atualUsado = new Set();
  pares.forEach(function(p){
    if(novoUsado.has(p.i) || atualUsado.has(p.j)) return;
    novoUsado.add(p.i); atualUsado.add(p.j);
    var campos = [{campo:"Texto", antes:p.atual.titulo, depois:p.novo.titulo}];
    if((p.atual.prazo||"") !== (p.novo.prazo||"")) campos.push({campo:"Prazo", antes: p.atual.prazo?formatDateBR(p.atual.prazo):"—", depois: p.novo.prazo?formatDateBR(p.novo.prazo):"—"});
    if(p.novo.responsavel && p.novo.responsavel !== p.atual.responsavel) campos.push({campo:"Responsável", antes: p.atual.responsavel||"—", depois: p.novo.responsavel});
    var sugestaoConclusao = PALAVRAS_CONCLUSAO.test(p.novo.titulo) && p.atual.status!=="CONCLUÍDO";
    atualizados.push({tipo:"atualizado", atual:p.atual, novo:Object.assign({}, p.novo, {id:p.atual.id}), camposAlterados:campos, sugestaoConclusao: sugestaoConclusao, reencontrado:false, correspondenciaAproximada:true});
  });

  novosSemMatch.forEach(function(novo, i){
    if(novoUsado.has(i)) return;
    novos.push({tipo:"novo", novo:novo, sugestaoConclusao: PALAVRAS_CONCLUSAO.test(novo.titulo)});
  });
  atuaisSemMatch.forEach(function(t, j){
    if(atualUsado.has(j)) return;
    if(!t.naoEncontradoNaPautaAtual) naoEncontrados.push({tipo:"ausente", atual:t});
  });

  return {
    novos:novos, atualizados:atualizados, naoEncontrados:naoEncontrados,
    resumo:{
      total: itensNovos.length,
      novos: novos.length,
      atualizados: atualizados.filter(function(a){return a.camposAlterados.length>0;}).length,
      sugestoesConclusao: novos.filter(function(n){return n.sugestaoConclusao;}).length + atualizados.filter(function(a){return a.sugestaoConclusao;}).length,
      prazosAlterados: atualizados.filter(function(a){return a.camposAlterados.some(function(c){return c.campo==="Prazo";});}).length,
      responsavelAlterados: atualizados.filter(function(a){return a.camposAlterados.some(function(c){return c.campo==="Responsável";});}).length,
      naoEncontrados: naoEncontrados.length
    }
  };
}

/* ============================================================
   CAMADA DE PERSISTÊNCIA — IndexedDB, isolada da interface.
   Arquitetura preparada para, no futuro, trocar a implementação
   interna por chamadas a uma API própria (Supabase/Firebase/
   PostgreSQL) sem alterar quem a consome (Master Prompt §36).
   ============================================================ */
var Store = (function(){
  var DB_NAME = "painel-fff-db", DB_VERSION = 1, db = null, disponivel = true;

  function openDatabase(){
    return new Promise(function(resolve){
      if(!("indexedDB" in window)){ disponivel=false; resolve(null); return; }
      var req;
      try{ req = indexedDB.open(DB_NAME, DB_VERSION); } catch(e){ disponivel=false; resolve(null); return; }
      req.onupgradeneeded = function(e){
        var d = e.target.result;
        if(!d.objectStoreNames.contains("tasks")) d.createObjectStore("tasks",{keyPath:"id"});
        if(!d.objectStoreNames.contains("imports")) d.createObjectStore("imports",{keyPath:"id"});
        if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta",{keyPath:"key"});
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ disponivel=false; resolve(null); };
    });
  }
  function tx(storeName, mode){
    return db.transaction(storeName, mode).objectStore(storeName);
  }
  function reqToPromise(req){
    return new Promise(function(resolve,reject){
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(){reject(req.error);};
    });
  }
  return {
    async init(){ db = await openDatabase(); return disponivel; },
    isDisponivel(){ return disponivel; },
    async getAllTasks(){
      if(!db) return [];
      return reqToPromise(tx("tasks","readonly").getAll());
    },
    async bulkPutTasks(arr){
      if(!db) return;
      var store = tx("tasks","readwrite");
      arr.forEach(function(t){ store.put(t); });
      return new Promise(function(res){ store.transaction.oncomplete=res; });
    },
    async putTask(t){
      if(!db) return;
      return reqToPromise(tx("tasks","readwrite").put(t));
    },
    async getAllImports(){
      if(!db) return [];
      return reqToPromise(tx("imports","readonly").getAll());
    },
    async addImport(imp){
      if(!db) return;
      return reqToPromise(tx("imports","readwrite").put(imp));
    },
    async getMeta(key){
      if(!db) return null;
      var r = await reqToPromise(tx("meta","readonly").get(key));
      return r ? r.value : null;
    },
    async setMeta(key, value){
      if(!db) return;
      return reqToPromise(tx("meta","readwrite").put({key:key, value:value}));
    },
    async limparTudo(){
      if(!db) return;
      ["tasks","imports","meta"].forEach(function(s){ tx(s,"readwrite").clear(); });
    }
  };
})();

function getFiltro(area){
  if(!STATE.filtros[area]) STATE.filtros[area] = {rapido:"todos", prioridade:"", responsavel:"", unidade:""};
  return STATE.filtros[area];
}
function tasksDaArea(area){ return STATE.tasks.filter(function(t){ return t.area===area; }); }
function responsaveisDaArea(area){
  var set = new Set();
  tasksDaArea(area).forEach(function(t){ if(t.responsavel) set.add(t.responsavel); });
  return Array.from(set).sort();
}
function unidadesDaArea(area){
  var set = new Set();
  tasksDaArea(area).forEach(function(t){ if(t.unidade) set.add(t.unidade); });
  return Array.from(set);
}
function aplicarFiltro(tasks, f){
  return tasks.filter(function(t){
    if(f.rapido==="hoje" && !isHoje(t)) return false;
    if(f.rapido==="7dias" && !isProximos7(t)) return false;
    if(f.rapido==="atraso" && !isAtrasado(t)) return false;
    if(f.rapido==="aguardar" && !isAAguardar(t)) return false;
    if(f.rapido==="concluidos" && t.status!=="CONCLUÍDO") return false;
    if(f.prioridade && t.prioridade!==f.prioridade) return false;
    if(f.responsavel && t.responsavel!==f.responsavel) return false;
    if(f.unidade && t.unidade!==f.unidade) return false;
    return true;
  });
}
function statsArea(tasks){
  return {
    abertos: tasks.filter(function(t){return STATUS_ABERTOS.indexOf(t.status)>=0;}).length,
    emCurso: tasks.filter(function(t){return t.status==="EM CURSO";}).length,
    aguardar: tasks.filter(isAAguardar).length,
    atrasados: tasks.filter(isAtrasado).length,
    concluidos: tasks.filter(function(t){return t.status==="CONCLUÍDO";}).length
  };
}

function parseHash(){
  var h = (location.hash||"").replace(/^#\/?/,"");
  var parts = h.split("/").filter(Boolean);
  if(parts.length===0) return {view:"visao-geral", area:null};
  if(parts[0]==="area" && parts[1] && SLUG_TO_AREA[parts[1]]) return {view:"area", area:SLUG_TO_AREA[parts[1]]};
  if(parts[0]==="historico") return {view:"historico", area:null};
  return {view:"visao-geral", area:null};
}
function navigate(hash){ location.hash = hash; }

  STATE.route = parseHash();

  window.scrollTo({top:0});
});

var CAMPOS_EDITAVEIS_LABEL = {
  status:"Status", prioridade:"Prioridade", responsavel:"Responsável",
  observacoes:"Observações", dependencias:"Dependências", aguardandoQuem:"A aguardar"
};
async function applyTaskEdit(taskId, campo, novoValor){
  var t = STATE.tasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  var valorAntigo = t[campo]||"";
  if(valorAntigo === novoValor) return;
  t[campo] = novoValor;
  t.ultimaAtualizacao = todayISO();
  var label = CAMPOS_EDITAVEIS_LABEL[campo]||campo;
  var evento = novoValor ? (label+" alterado para "+novoValor+".") : (label+" removido.");
  t.historico.push({data: todayISO(), evento: evento});
  await Store.putTask(t);
  render();
  renderDrawer();
}

/* ============================================================
   BUSCA GLOBAL
   ============================================================ */
function buscarTarefas(query){
  var q = normalizeTxt(query).trim();
  if(!q) return [];
  var termos = q.split(/\s+/);
  function matches(t){
    var campo = normalizeTxt([t.titulo,t.descricao,t.responsavel,t.area,t.unidade,t.observacoes,t.textoOriginal,
      (t.historico||[]).map(function(h){return h.evento;}).join(" ")].join(" "));
    return termos.every(function(term){ return campo.indexOf(term)>=0; });
  }
  return STATE.tasks.filter(matches).slice(0,60);
}
function highlightText(text, query){
  var q = query.trim();
  if(!q) return escapeHtml(text);
  try{
    var re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    return escapeHtml(text).replace(re, function(m){return "<mark>"+m+"</mark>";});
  }catch(e){ return escapeHtml(text); }
}

function taskRowMeta(t){
  var bits = [];
  if(isAtrasado(t)){
    var d = diffDaysFromToday(t.prazo);
    bits.push('<span class="badge badge--atraso">'+d+(d===1?" dia em atraso":" dias em atraso")+'</span>');
  } else if(t.prazo){
    bits.push('<span class="tnum">'+formatDateBR(t.prazo)+'</span>');
  } else {
    bits.push('<span class="muted">—</span>');
  }
  return bits.join(" ");
}
function renderTaskTable(tasks, opts){
  opts = opts||{};
  if(!tasks.length){
    return '<div class="tablewrap"><div class="emptystate"><b>Sem tarefas para estes filtros</b>Ajuste os filtros acima ou aguarde a próxima atualização da pauta.</div></div>';
  }
  var rows = tasks.map(function(t){
    var flags = [];
    if(t.naoEncontradoNaPautaAtual) flags.push('<span class="flag">'+icon("alert")+' não encontrado na pauta atual</span>');
    if(t.reverInformacao) flags.push('<span class="flag">'+icon("alert")+' rever informação</span>');
    return '<tr data-action="open-task" data-id="'+t.id+'">'+
      '<td class="td-title">'+
        (t.unidade?'<div class="unidade">'+escapeHtml(t.unidade)+'</div>':'')+
        '<div class="titulo">'+escapeHtml(t.titulo)+'</div>'+
        (flags.length?'<div class="flags">'+flags.join("")+'</div>':'')+
      '</td>'+
      (opts.showArea?'<td class="td-nowrap muted">'+escapeHtml(t.area)+'</td>':'')+
      '<td class="td-nowrap">'+taskRowMeta(t)+'</td>'+
      '<td class="td-nowrap"><span class="badge '+statusBadgeClass(t.status)+'"><span class="dot"></span>'+t.status+'</span></td>'+
      '<td class="td-nowrap">'+(t.responsavel?escapeHtml(t.responsavel):'<span class="muted">—</span>')+'</td>'+
    '</tr>';
  }).join("");
  return '<div class="tablewrap"><table class="tasktable"><thead><tr>'+
    '<th>Tarefa</th>'+(opts.showArea?'<th>Área</th>':'')+'<th>Prazo</th><th>Status</th><th>Nome</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderTaskCards(tasks, opts){
  opts = opts||{};
  if(!tasks.length){
    return '<div class="emptystate"><b>Sem tarefas para estes filtros</b>Ajuste os filtros ou aguarde a próxima atualização.</div>';
  }
  return '<div class="taskcards">'+tasks.map(function(t){
    return '<div class="taskcard" data-action="open-task" data-id="'+t.id+'">'+
      '<div class="taskcard__top"><div>'+
        (t.unidade?'<div class="unidade">'+escapeHtml(t.unidade)+'</div>':'')+
        '<div class="titulo">'+escapeHtml(t.titulo)+'</div>'+
        (opts.showArea?'<div class="taskcard__area">'+escapeHtml(t.area)+'</div>':'')+
      '</div></div>'+
      '<div class="taskcard__foot">'+
        '<span class="badge '+statusBadgeClass(t.status)+'"><span class="dot"></span>'+t.status+'</span>'+
        '<span class="taskcard__prazo">'+taskRowMeta(t)+'</span>'+
        (t.responsavel?'<span class="taskcard__nome">'+escapeHtml(t.responsavel)+'</span>':'')+
      '</div>'+
    '</div>';
  }).join("")+'</div>';
}
function renderTaskList(tasks, opts){ return renderTaskTable(tasks,opts) + renderTaskCards(tasks,opts); }

function compactList(tasks, emptyMsg, opts){

  var neg = v < 0;

function renderLegendRow(items){
  return '<div class="dre-legend">'+items.map(function(it){
    return '<div class="dre-legend__row"><i style="background:'+it.color+'"></i>'+escapeHtml(it.label)+'</div>';
  }).join("")+'</div>';
}

function renderGroupedBarsGeneric(xLabels, series, yFmt){
  var max = 1;
  series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) max = Math.max(max, Math.abs(v)); }); });
  var cols = xLabels.map(function(lb,i){
    var bars = series.map(function(s){
      var v = s.values[i];
      if(v==null){ return ''; }
      var h = Math.max(2, Math.round(Math.abs(v)/max*150));
      return '<div class="drechart__bar" style="height:'+h+'px;background:'+s.color+'" title="'+escapeHtml(s.name)+' '+escapeHtml(lb)+': '+escapeHtml(yFmt(v))+'"></div>';
    }).join("");
    return '<div class="drechart__col"><div class="drechart__bars">'+bars+'</div><div class="drechart__label">'+escapeHtml(lb)+'</div></div>';
  }).join("");
  return '<div class="drechart">'+cols+'</div>';
}

function renderLineChartGeneric(xLabels, series, opts){
  opts = opts || {};
  var H = opts.height || 190;
  var padL = 46, padR = 14, padT = 12, padB = 24;
  var colW = opts.colWidth || 58;
  var n = xLabels.length;
  var width = Math.max(340, padL + padR + (n-1)*colW);
  var plotW = width - padL - padR, plotH = H - padT - padB;

  var allVals = [];
  series.forEach(function(s){ s.points.forEach(function(v){ if(v!=null) allVals.push(v); }); });
  var yMin = opts.yMin != null ? opts.yMin : Math.min.apply(null, allVals.concat([0]));
  var yMax = opts.yMax != null ? opts.yMax : Math.max.apply(null, allVals);
  if(yMax === yMin){ yMax = yMin + 1; }
  var span = yMax - yMin;
  var yFmt = opts.yFmt || function(v){ return String(Math.round(v)); };

  function xPos(i){ return padL + (n<=1?0:(i/(n-1))*plotW); }
  function yPos(v){ return padT + (1 - (v-yMin)/span) * plotH; }

  var tickCount = 4;
  var ticks = [];
  for(var t=0;t<=tickCount;t++){ ticks.push(yMin + (span*t/tickCount)); }
  var zeroLine = "";
  if(yMin < 0 && yMax > 0){
    var zy = yPos(0);
    zeroLine = '<line x1="'+padL+'" y1="'+zy.toFixed(1)+'" x2="'+(width-padR)+'" y2="'+zy.toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1.2"/>';
  }
  var gridlines = ticks.map(function(tk){
    var y = yPos(tk);
    return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(width-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
      '<text x="'+(padL-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9.5">'+escapeHtml(yFmt(tk))+'</text>';
  }).join("");
  var xlabels = xLabels.map(function(lb,i){
    return '<text x="'+xPos(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5">'+escapeHtml(lb)+'</text>';
  }).join("");

  var linesHtml = series.map(function(s){
    var segs = [], cur = [];
    s.points.forEach(function(v,i){
      if(v==null){ if(cur.length>1) segs.push(cur); cur=[]; return; }
      cur.push([xPos(i), yPos(v)]);
    });
    if(cur.length>1) segs.push(cur);
    var pathStr = segs.map(function(seg){
      return '<polyline points="'+seg.map(function(pt){return pt[0].toFixed(1)+","+pt[1].toFixed(1);}).join(" ")+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
    }).join("");
    var dots = s.points.map(function(v,i){
      if(v==null) return "";
      var cx=xPos(i), cy=yPos(v);
      return '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="'+s.color+'"><title>'+escapeHtml(s.name)+' '+escapeHtml(xLabels[i])+': '+escapeHtml(yFmt(v))+'</title></circle>';
    }).join("");
    return pathStr+dots;
  }).join("");

  return '<div class="linechart-wrap"><svg width="'+width+'" height="'+H+'" viewBox="0 0 '+width+' '+H+'">'+gridlines+zeroLine+linesHtml+xlabels+'</svg></div>';
}

function formatPct1(v){ return (v==null?"—": (v>=0?"":"") + v.toFixed(1).replace(".",",") + "%"); }
function formatPP(v){ return (v==null?"—": (v>0?"+":"") + v.toFixed(1).replace(".",",") + " p.p."); }
function formatNum0(v){ return v==null?"—":Math.round(v).toLocaleString ? String(Math.round(v)) : String(Math.round(v)); }
function formatEURorDash(v){ return v==null ? "—" : formatEUR(v); }

/* ============================================================
   OPEX vs. RECEITA BRUTA — evolução do rácio e margem EBITDA
   ============================================================ */
function computeOpexEvolucao(){
  var meses = DRE_CO_MENSAL;
  var linhas = [], prevRatio = null, prevOpex = null;
  meses.forEach(function(d){
    var ratio = d.opex/d.receitaBruta*100;
    var margem = d.ebitda/d.receitaBruta*100;
    var dPP = prevRatio==null ? null : (ratio-prevRatio);
    var dOpexPct = prevOpex==null ? null : ((d.opex-prevOpex)/prevOpex*100);
    linhas.push({mes:d.mes, ratio:ratio, margem:margem, dPP:dPP, dOpexPct:dOpexPct});
    prevRatio = ratio; prevOpex = d.opex;
  });
  var d2025 = meses.slice(0,8), d2026 = meses.slice(8);
  function avg(arr,k){ return arr.reduce(function(s,d){return s+d[k];},0)/arr.length; }
  var rb25=avg(d2025,"receitaBruta"), op25=avg(d2025,"opex"), eb25=avg(d2025,"ebitda");
  var rb26=avg(d2026,"receitaBruta"), op26=avg(d2026,"opex"), eb26=avg(d2026,"ebitda");
  return {
    linhas: linhas,
    m2025: {receitaBruta:rb25, opex:op25, ratio:op25/rb25*100, ebitda:eb25, margem:eb25/rb25*100},
    m2026: {receitaBruta:rb26, opex:op26, ratio:op26/rb26*100, ebitda:eb26, margem:eb26/rb26*100}
  };
}
function renderOpexEvolucao(){
  var calc = computeOpexEvolucao();
  var labels = calc.linhas.map(function(l){return l.mes;});

  var lineChart = renderLineChartGeneric(labels, [
    {name:"OPEX / Receita bruta", color: COR_TONUS, points: calc.linhas.map(function(l){return l.ratio;})},
    {name:"Margem EBITDA", color: COR_VIDYA, points: calc.linhas.map(function(l){return l.margem;})}
  ], {yFmt:function(v){return Math.round(v)+"%";}});

  var linhas = calc.linhas.map(function(l){
    return '<tr><td>'+escapeHtml(l.mes)+'</td>'+
      '<td class="'+(l.ratio<=80?"c-pos":"c-neg")+'">'+formatPct1(l.ratio)+'</td>'+
      '<td class="'+(l.margem>=0?"c-pos":"c-neg")+'">'+formatPct1(l.margem)+'</td>'+
      '<td>'+(l.dPP==null?"—":formatPP(l.dPP))+'</td>'+
      '<td>'+(l.dOpexPct==null?"—":formatPct1(l.dOpexPct))+'</td></tr>';
  }).join("");

  var m25 = calc.m2025, m26 = calc.m2026;
  var ratioDiff = m26.ratio-m25.ratio, margemDiff = m26.margem-m25.margem;
  var linhaResumo1 = '<tr class="is-total"><td>Média 2025 (8 meses)</td><td>'+formatPct1(m25.ratio)+'</td><td class="'+(m25.margem>=0?"c-pos":"c-neg")+'">'+formatPct1(m25.margem)+'</td><td>—</td><td>—</td></tr>';
  var linhaResumo2 = '<tr class="is-total"><td>Média 2026 (7 meses)</td><td>'+formatPct1(m26.ratio)+'</td><td class="'+(m26.margem>=0?"c-pos":"c-neg")+'">'+formatPct1(m26.margem)+'</td><td>—</td><td>—</td></tr>';
  var linhaVar = '<tr class="is-total"><td>Variação 2026 vs. 2025</td><td class="'+(ratioDiff<=0?"c-pos":"c-neg")+'">'+formatPP(ratioDiff)+'</td><td class="'+(margemDiff>=0?"c-pos":"c-neg")+'">'+formatPP(margemDiff)+'</td><td>—</td><td>—</td></tr>';

  return '<div class="sec"><div class="sec__head"><div class="sec__title">'+
      '<div class="areabadge" style="width:30px;height:30px;">'+icon("calculator")+'</div>'+
      'Queda do OPEX vs. Receita Bruta e margem EBITDA<span class="n">mai/25 a jul/26</span></div></div>'+

    '<div class="vizcard" style="margin-bottom:14px;">'+
      '<div class="sec__title" style="margin-bottom:4px;font-size:13.5px;">OPEX / Receita bruta e Margem EBITDA — evolução mensal</div>'+
      renderLegendRow([{color:COR_TONUS,label:"OPEX / Receita bruta"},{color:COR_VIDYA,label:"Margem EBITDA"}])+
      lineChart+
      '<div class="dre-note">Marco de "nova gestão" a partir de mai/26 identificado na planilha de origem — a partir desse mês a margem EBITDA mantém-se acima de 12% em todos os meses.</div>'+
    '</div>'+

    '<div class="vizcard" style="margin-bottom:6px;">'+
      '<div class="sec__title" style="margin-bottom:12px;font-size:13.5px;">Detalhe mensal</div>'+
      '<div class="dretable-wrap"><table class="dretable"><thead><tr><th>Período</th><th>OPEX / Receita</th><th>Margem EBITDA</th><th>Δ rácio (p.p.)</th><th>Δ OPEX % (m/m)</th></tr></thead>'+
      '<tbody>'+linhas+linhaResumo1+linhaResumo2+linhaVar+'</tbody></table></div>'+
    '</div>'+
    '<div class="dre-origin">Origem: "Queda do OPEX vs. Receita Bruta e Margem EBITDA", enviada por Matheus — 04/09/2026. Rácios, margens e variações recalculados a partir dos valores exatos de Receita Bruta, OPEX e EBITDA já confirmados na DRE — os resultados batem com os arredondamentos da planilha original. Nota: a planilha de origem rotula a última coluna como "Δ OPEX € (m/m)", mas os valores nela são variações percentuais (confirmado pelo cálculo) — mantivemos aqui o rótulo "Δ OPEX % (m/m)" para refletir o que os números de facto representam.</div>'+
  '</div>';
}

function aggSaldanhaPorTipo(){
  var ordem = ["CAPEX","Custo de estruturação","OPEX Pré-Operacional","Taxa de Franquia","ATIVO"];
  var map = {};
  ordem.forEach(function(t){ map[t] = {previsto:0, real:0}; });
  SALDANHA_OBRA_ITENS.forEach(function(it){
    if(!map[it.tipo]) map[it.tipo] = {previsto:0, real:0};
    map[it.tipo].previsto += it.previsto;
    map[it.tipo].real += (it.real||0);
  });
  return ordem.filter(function(t){return map[t];}).map(function(t){ return {tipo:t, previsto:map[t].previsto, real:map[t].real}; });
}

  "CAPEX":"CAPEX", "Custo de estruturação":"Estruturação", "OPEX Pré-Operacional":"OPEX pré-op.",

};

function renderDivergingBarsGeneric(xLabels, values, opts){
  opts = opts || {};
  var fmt = opts.fmt || function(v){ return String(v); };
  var maxAbs = Math.max.apply(null, values.map(function(v){ return Math.abs(v||0); }).concat([1]));
  var cols = xLabels.map(function(lb,i){
    var v = values[i];
    var h = Math.max(2, Math.round(Math.abs(v)/maxAbs*70));
    var top = "", bottom = "";
    if(v > 0){
      top = '<div class="drediv__bar drediv__bar--pos" style="height:'+h+'px" title="'+escapeHtml(lb)+': '+escapeHtml(fmt(v))+'"></div>';
    } else if(v < 0){
      bottom = '<div class="drediv__bar drediv__bar--neg" style="height:'+h+'px" title="'+escapeHtml(lb)+': '+escapeHtml(fmt(v))+'"></div>';
    }
    return '<div class="drediv__col">'+
      '<div class="drediv__stack">'+
        '<div class="drediv__top">'+top+'</div>'+
        '<div class="drediv__bottom">'+bottom+'</div>'+
      '</div>'+
      '<div class="drediv__label">'+escapeHtml(lb)+'</div>'+
    '</div>';
  }).join("");
  return '<div class="drediv">'+cols+'</div>';
}

function encontroContasTodasLinhas(){
  var out = [];
  ENCONTRO_CONTAS_GRUPOS.forEach(function(g){ g.forEach(function(l){ out.push(l); }); });
  return out;
}

function encontroContasPosicaoLiquida(){
  var mapa = {};
  function add(nome, delta){ mapa[nome] = (mapa[nome]||0) + delta; }
  encontroContasTodasLinhas().forEach(function(l){
    add(l.pagador, -l.valor);
    add(l.recebedor, l.valor);
  });
  var lista = Object.keys(mapa).map(function(nome){ return {nome:nome, saldo:mapa[nome]}; });
  lista.sort(function(a,b){ return b.saldo - a.saldo; });
  return lista;
}

function performanceRankStudio(estudio){
  return PERFORMANCE_PROFESSORES.filter(function(p){ return p.rank!=null && p.estudio===estudio; })
    .sort(function(a,b){ return b.ocupComissao - a.ocupComissao; });
}
function performanceTendenciaBadge(t){
  if(t==="MELHORANDO") return '<span class="badge badge--concluido">Melhorando</span>';
  if(t==="PIORANDO") return '<span class="badge badge--bloqueado">Piorando</span>';
  if(t==="ESTAVEL") return '<span class="badge badge--porIniciar">Estável</span>';
  return '<span class="muted">—</span>';
}
function pct1OrDash(v){ return v==null ? "—" : formatPct1(v*100); }
function ppOrDash(v){ return v==null ? "—" : formatPP(v*100); }

function renderRHPerformance(){
  var ranked = PERFORMANCE_PROFESSORES.filter(function(p){ return p.rank!=null; });
  var totalProf = ranked.length;
  var somaOcup = ranked.reduce(function(s,p){ return s+p.ocupComissao; }, 0);
  var mediaOcup = totalProf ? somaOcup/totalProf : null;
  var melhorando = ranked.filter(function(p){ return p.tendencia==="MELHORANDO"; }).length;
  var piorando = ranked.filter(function(p){ return p.tendencia==="PIORANDO"; }).length;
  var totalPagar = ranked.reduce(function(s,p){ return s+(p.totalPagar||0); }, 0);

  var kpis = [
    {label:"Professores ativos (com ranking)", val: String(totalProf)},
    {label:"Ocupação média (comissão)", val: pct1OrDash(mediaOcup)},
    {label:"Em melhoria", val: String(melhorando)},
    {label:"Em queda", val: String(piorando)},
    {label:"Total a pagar (comissões de agosto/2026)", val: formatEUR(totalPagar)}
  ].map(function(k){
    return '<div class="drekpi"><span>'+k.label+'</span><b>'+k.val+'</b></div>';
  }).join("");

  function tabelaRanking(estudio, titulo){
    var lista = performanceRankStudio(estudio);
    var linhas = lista.map(function(p){
      return '<tr><td>'+p.rank+'</td>'+
        '<td style="text-align:left;">'+escapeHtml(p.nome)+'</td>'+
        '<td>'+p.aulas+'</td>'+
        '<td>'+pct1OrDash(p.ocupComissao)+'</td>'+
        '<td style="text-align:left;">'+performanceTendenciaBadge(p.tendencia)+'</td></tr>';
    }).join("");
    return '<div class="vizcard" style="margin-bottom:14px;">'+
      '<div class="sec__title" style="margin-bottom:12px;font-size:13.5px;">'+titulo+'<span class="n">'+lista.length+'</span></div>'+
      '<div class="dretable-wrap"><table class="dretable"><thead><tr>'+
        '<th>#</th><th style="text-align:left;">Professor</th><th>Aulas</th><th>Ocup. comissão</th><th style="text-align:left;">Tendência</th>'+
      '</tr></thead><tbody>'+linhas+'</tbody></table></div>'+
    '</div>';
  }

  var linhasDetalhe = PERFORMANCE_PROFESSORES.map(function(p){
    var alerta = p.nome==="Cancelado" ? ' <span class="badge badge--aAguardar" title="Consta como estúdio TONUS na planilha de origem, mas com valor/aula de €26,00 (tarifa VIDYA) em vez de €15,00 (tarifa TONUS). Preservado tal como na fonte.">Rever informação</span>' : '';
    return '<tr>'+
      '<td>'+(p.rank!=null?p.rank:"—")+'</td>'+
      '<td style="text-align:left;">'+escapeHtml(p.nome)+alerta+'</td>'+
      '<td style="text-align:left;">'+escapeHtml(p.estudio)+'</td>'+
      '<td>'+p.aulas+'</td>'+
      '<td>'+p.checkinTotal+'</td>'+
      '<td>'+p.capacidadeTotal+'</td>'+
      '<td>'+p.vagasOciosas+'</td>'+
      '<td>'+pct1OrDash(p.ocupTotal)+'</td>'+
      '<td>'+p.cortesias+'</td>'+
      '<td>'+p.checkinComissao+'</td>'+
      '<td>'+pct1OrDash(p.ocupComissao)+'</td>'+
      '<td>'+pct1OrDash(p.ocupUlt7d)+'</td>'+
      '<td>'+pct1OrDash(p.ocupPeriodoAnterior)+'</td>'+
      '<td class="'+(p.variacaoPP>0?"c-pos":(p.variacaoPP<0?"c-neg":""))+'">'+ppOrDash(p.variacaoPP)+'</td>'+
      '<td>'+pct1OrDash(p.melhorAula)+'</td>'+
      '<td>'+pct1OrDash(p.piorAula)+'</td>'+
      '<td style="text-align:left;">'+performanceTendenciaBadge(p.tendencia)+'</td>'+
      '<td class="'+(p.perfVsMedia>0?"c-pos":(p.perfVsMedia<0?"c-neg":""))+'">'+ppOrDash(p.perfVsMedia)+'</td>'+
      '<td>'+(p.baseAula!=null?formatEUR(p.baseAula):"—")+'</td>'+

      '<td>'+(p.totalPagar!=null?formatEUR(p.totalPagar):"—")+'</td>'+

    tabelaRanking("VIDYA","Ranking Vidya")+
    tabelaRanking("TONUS","Ranking Tonus")+

      '<div class="sec__title" style="margin-bottom:12px;font-size:13.5px;">Detalhe por professor</div>'+
      '<div class="dretable-wrap"><table class="dretable"><thead><tr>'+

    '<div class="dre-note">"Head of Accounts", "Otto" e "Temporário" constam na planilha de origem sem aulas nem valores associados neste período — mantidos aqui tal como na fonte, sem posição de ranking. A linha "Cancelado" está sinalizada para revisão: consta como estúdio TONUS, mas com valor por aula de €26,00 (tarifa padrão Vidya) em vez de €15,00 (tarifa padrão Tonus) — preservado literalmente da fonte, sem correção automática.</div>'+

function renderRH(){
  var view = STATE.rhView || "tarefas";
  var area = "RH";
  var all = tasksDaArea(area);
  var tabs = RH_TABS.map(function(tb){
    return '<div class="segctrl__item'+(view===tb.key?" is-active":"")+'" data-action="rh-tab" data-view="'+tb.key+'">'+tb.label+'</div>';
  }).join("");

  var corpo;
  if(view==="performance"){
    corpo = renderRHPerformance();
  } else {
    var f = getFiltro(area);
    var filtrados = aplicarFiltro(all, f);
    var responsaveis = responsaveisDaArea(area);
    var unidades = unidadesDaArea(area);
    var chips = FILTROS_RAPIDOS.map(function(ff){
      return '<div class="chip'+(f.rapido===ff.key?" is-active":"")+'" data-action="chip-filter" data-area="'+area+'" data-key="rapido" data-value="'+ff.key+'">'+ff.label+'</div>';
    }).join("");
    corpo = '<div class="filterbar">'+chips+
      '<div class="filterbar__sep"></div>'+
      (responsaveis.length?renderSelect("responsavel", f.responsavel, area, "Responsável", responsaveis):"")+
      (unidades.length>1?renderSelect("unidade", f.unidade, area, "Unidade", unidades):"")+
      '</div>'+
      renderTaskList(filtrados, {showArea:false});
  }

  return (
    '<div class="pagehead"><div class="pageheadrow">'+
      '<div class="areabadge">'+icon("users")+'</div>'+
      '<div><div class="pagehead__eyebrow">Área</div><h1>RH</h1>'+
      '<div class="pagehead__meta">'+all.length+' tarefas registadas nesta área</div>'+
    '</div></div></div>'+
    '<div class="segctrl" style="margin-bottom:20px;">'+tabs+'</div>'+
    corpo
  );
}

function renderHistorico(){
  var imps = STATE.imports.slice().sort(function(a,b){return b.dataHora.localeCompare(a.dataHora);});
  if(!imps.length){
    return '<div class="pagehead"><div><h1>Histórico de importações</h1></div></div><div class="emptystate"><b>Sem importações registadas</b></div>';
  }
  var rows = imps.map(function(imp){
    return '<div class="diffrow" style="margin-bottom:10px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">'+
        '<b style="font-size:13px;">'+formatDateTimeBR(imp.dataHora)+'</b>'+
        '<span class="muted" style="font-size:11.5px;">'+escapeHtml(imp.ficheiro)+'</span>'+
      '</div>'+
      '<div class="pagehead__meta" style="margin-top:6px;">'+imp.totalAnalisados+' itens analisados · '+imp.novos+' novos · '+imp.atualizados+' atualizados · '+imp.concluidos+' concluídos · '+imp.prazosAlterados+' prazos alterados · '+imp.responsavelAlterados+' responsáveis alterados · '+imp.naoEncontrados+' não encontrados</div>'+
      (imp.detalhes&&imp.detalhes.length?'<ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--ink-2);">'+imp.detalhes.slice(0,12).map(function(d){return '<li>'+escapeHtml(d)+'</li>';}).join("")+'</ul>':'')+
    '</div>';
  }).join("");
  return '<div class="pagehead"><div><div class="pagehead__eyebrow">Auditoria</div><h1>Histórico de importações</h1><div class="pagehead__meta">'+imps.length+' importações registadas</div></div></div>'+rows;
}

  }).join("");

  function selectField(campo, options, current){
    var opts = '<option value="">—</option>'+options.map(function(o){return '<option value="'+o+'"'+(current===o?" selected":"")+'>'+o+'</option>';}).join("");
    return '<select data-action="edit-field" data-campo="'+campo+'" data-id="'+t.id+'">'+opts+'</select>';
  }
  function textField(campo, current, placeholder){
    return '<input type="text" data-action="edit-field" data-campo="'+campo+'" data-id="'+t.id+'" value="'+escapeHtml(current||"")+'" placeholder="'+(placeholder||"—")+'" />';
  }
  function areaField(campo, current, placeholder){

  }

  '</select>';

  return (
    '<div class="drawer is-open">'+
      '<div class="drawer__head">'+
        '<div class="areabadge">'+icon(areaIconName(t.area))+'</div>'+

function diffRowHtml(row, idx){
  if(row.tipo==="novo"){
    return '<div class="diffrow"><span class="diffrow__tag diffrow__tag--novo">Novo</span>'+
      (row.novo.unidade?'<div class="pagehead__meta">'+escapeHtml(row.novo.unidade)+' · '+escapeHtml(row.novo.area)+'</div>':'<div class="pagehead__meta">'+escapeHtml(row.novo.area)+'</div>')+
      '<div class="diffrow__title">'+escapeHtml(row.novo.titulo)+'</div>'+
      (row.novo.prazo?'<div class="diffrow__change">Prazo: <span class="after">'+formatDateBR(row.novo.prazo)+'</span></div>':'')+
      (row.sugestaoConclusao?'<label class="diffrow__change" style="margin-top:6px;cursor:pointer;"><input type="checkbox" data-action="toggle-sugestao" data-idx="'+idx+'" '+(STATE.importModal.aceitas[row.novo.id]?"checked":"")+'/> Marcar como concluído ao confirmar</label>':'')+
    '</div>';
  }
  if(row.tipo==="atualizado"){
    var changes = row.camposAlterados.map(function(c){
      return '<div class="diffrow__change">'+c.campo+': <span class="before">'+escapeHtml(c.antes)+'</span> → <span class="after">'+escapeHtml(c.depois)+'</span></div>';
    }).join("");
    return '<div class="diffrow"><span class="diffrow__tag diffrow__tag--atualizado">Atualizado</span>'+
      '<div class="pagehead__meta">'+escapeHtml(row.atual.area)+(row.atual.unidade?' · '+escapeHtml(row.atual.unidade):"")+'</div>'+
      '<div class="diffrow__title">'+escapeHtml(row.novo.titulo)+'</div>'+
      changes+
      (row.reencontrado?'<div class="diffrow__change" style="color:var(--success);">Reencontrado na pauta atual (deixa de estar marcado como ausente).</div>':'')+
      (row.sugestaoConclusao?'<label class="diffrow__change" style="margin-top:6px;cursor:pointer;"><input type="checkbox" data-action="toggle-sugestao" data-idx="'+idx+'" '+(STATE.importModal.aceitas[row.novo.id]?"checked":"")+'/> Marcar como concluído ao confirmar</label>':'')+
    '</div>';
  }
  // ausente
  return '<div class="diffrow"><span class="diffrow__tag diffrow__tag--ausente">Não encontrado na pauta atual</span>'+
    '<div class="pagehead__meta">'+escapeHtml(row.atual.area)+(row.atual.unidade?' · '+escapeHtml(row.atual.unidade):"")+'</div>'+
    '<div class="diffrow__title">'+escapeHtml(row.atual.titulo)+'</div>'+
    '<div class="diffrow__change">A tarefa é mantida como pendência e assinalada — não é eliminada automaticamente.</div>'+
  '</div>';
}

/* ============================================================
   IMPORTAÇÃO DE FICHEIRO WORD (.docx) — mammoth.js, tudo no navegador
   ============================================================ */
function processarFicheiro(file){
  if(!file) return;
  if(typeof mammoth === "undefined"){
    STATE.importModal.erro = "Não foi possível carregar o leitor de documentos Word. Verifique a ligação à internet e tente novamente.";
    render(); return;
  }
  var ext = (file.name||"").toLowerCase();
  if(!ext.endsWith(".docx")){
    STATE.importModal.erro = "Formato não suportado. Selecione um ficheiro .docx.";
    render(); return;
  }
  STATE.importModal.step = "parsing";
  STATE.importModal.ficheiroNome = file.name;
  render();

  var reader = new FileReader();
  reader.onload = function(e){
    mammoth.extractRawText({arrayBuffer: e.target.result}).then(function(result){
      var linhas = (result.value||"").split("\n");
      var ctx = {
        anoReferencia: new Date().getFullYear(),
        origemPauta: "Pauta de "+formatDateBR(todayISO()),
        origemFicheiro: file.name,
        dataImportacao: todayISO()
      };
      var itensNovos = parseLinhas(linhas, ctx);
      if(!itensNovos.length){
        STATE.importModal.step = "select";
        STATE.importModal.erro = "Não foi possível identificar nenhum dos 14 blocos oficiais neste documento. Confirme se a estrutura da pauta foi mantida.";
        render(); return;
      }
      var diff = compararImportacao(STATE.tasks, itensNovos);
      STATE.importModal.diff = diff;
      STATE.importModal.itensNovos = itensNovos;
      STATE.importModal.step = "preview";
      STATE.importModal.aceitas = {};
      render();
    }).catch(function(err){
      STATE.importModal.step = "select";
      STATE.importModal.erro = "Não foi possível ler o documento. Verifique se o ficheiro não está corrompido.";
      render();
    });
  };
  reader.onerror = function(){
    STATE.importModal.step = "select";
    STATE.importModal.erro = "Não foi possível ler o ficheiro selecionado.";
    render();
  };
  reader.readAsArrayBuffer(file);
}

async function confirmarImportacao(){
  var m = STATE.importModal;
  var diff = m.diff;
  var dataImportacao = todayISO();
  var mapAtuais = {};
  STATE.tasks.forEach(function(t){ mapAtuais[t.id]=t; });

  diff.novos.forEach(function(row){
    var novo = row.novo;
    if(row.sugestaoConclusao && m.aceitas[novo.id]){
      novo.status = "CONCLUÍDO";
      novo.historico.push({data:dataImportacao, evento:"Marcado como concluído (sugestão aceite na importação)."});
    }
    STATE.tasks.push(novo);
  });

  diff.atualizados.forEach(function(row){
    var t = mapAtuais[row.atual.id];
    row.camposAlterados.forEach(function(c){
      if(c.campo==="Texto"){ t.titulo = row.novo.titulo; t.historico.push({data:dataImportacao, evento:'Texto atualizado: "'+c.antes+'" → "'+c.depois+'".'}); }
      if(c.campo==="Prazo"){ t.prazo = row.novo.prazo; t.historico.push({data:dataImportacao, evento:"Prazo alterado: "+c.antes+" → "+c.depois+"."}); }
      if(c.campo==="Unidade"){ t.unidade = row.novo.unidade; t.historico.push({data:dataImportacao, evento:"Unidade alterada: "+c.antes+" → "+c.depois+"."}); }
      if(c.campo==="Responsável"){ t.responsavel = row.novo.responsavel; t.historico.push({data:dataImportacao, evento:"Responsável atualizado para "+c.depois+"."}); }
    });
    if(row.reencontrado){ t.naoEncontradoNaPautaAtual = false; t.historico.push({data:dataImportacao, evento:"Reencontrado na pauta atual."}); }
    if(row.sugestaoConclusao && m.aceitas[row.novo.id]){
      t.status = "CONCLUÍDO";
      t.historico.push({data:dataImportacao, evento:"Marcado como concluído (sugestão aceite na importação)."});
    }
    t.textoOriginal = row.novo.textoOriginal;
    t.ultimaAtualizacao = dataImportacao;
  });

  diff.naoEncontrados.forEach(function(row){
    var t = mapAtuais[row.atual.id];
    t.naoEncontradoNaPautaAtual = true;
    t.ultimaAtualizacao = dataImportacao;
    t.historico.push({data:dataImportacao, evento:"Não encontrado na pauta atual — mantido como pendência, não eliminado."});
  });

  var concluidosNestaImportacao = diff.novos.filter(function(r){return r.sugestaoConclusao && m.aceitas[r.novo.id];}).length +
    diff.atualizados.filter(function(r){return r.sugestaoConclusao && m.aceitas[r.novo.id];}).length;

  var registoImport = {
    id: "import-"+Date.now(),
    dataHora: new Date().toISOString(),
    ficheiro: m.ficheiroNome,
    totalAnalisados: m.itensNovos.length,
    novos: diff.resumo.novos,
    atualizados: diff.resumo.atualizados,
    concluidos: concluidosNestaImportacao,
    prazosAlterados: diff.resumo.prazosAlterados,
    responsavelAlterados: diff.resumo.responsavelAlterados,
    naoEncontrados: diff.resumo.naoEncontrados,
    detalhes: [
      diff.resumo.novos+" novos itens identificados.",
      diff.resumo.atualizados+" itens atualizados.",
      diff.resumo.prazosAlterados+" alterações de prazo.",
      diff.resumo.responsavelAlterados+" alterações de responsável.",
      diff.resumo.naoEncontrados+" itens não encontrados na pauta atual (mantidos como pendência)."
    ]
  };

  await Store.bulkPutTasks(STATE.tasks);
  await Store.addImport(registoImport);
  STATE.imports.push(registoImport);

  STATE.importModal.step = "done";
  render();
  toast("Pauta atualizada: "+registoImport.novos+" novos, "+registoImport.atualizados+" atualizados.");
}

/* ============================================================
   TEMA
   ============================================================ */
function applyTheme(){
  var root = document.documentElement;
  if(STATE.theme==="light") root.setAttribute("data-theme","light");
  else if(STATE.theme==="dark") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme");
  try{ localStorage.setItem("fff-painel-theme", STATE.theme); }catch(e){}
}

/* ============================================================
   EVENTOS (delegação única em document)
   ============================================================ */
function wireEvents(){
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    if(action==="nav-goto"){ e.preventDefault(); if(STATE.searchOpen||STATE.mobileSheet){ closeAllOverlays(); } navigate(el.getAttribute("data-hash")); }
    else if(action==="open-task"){ openDrawer(el.getAttribute("data-id")); }
    else if(action==="close-overlay"){ closeAllOverlays(); render(); }
    else if(action==="open-search"){ openSearch(); }
    else if(action==="open-import"){ openImport(); }
    else if(action==="open-config"){ openConfig(); }
    else if(action==="open-sheet"){ openSheet(el.getAttribute("data-which")); }
    else if(action==="mobile-hoje"){ closeAllOverlays(); navigate("#/visao-geral"); }
    else if(action==="scroll-to"){
      var targetEl = document.getElementById(el.getAttribute("data-target"));
      if(targetEl) targetEl.scrollIntoView({behavior:"smooth", block:"start"});
    }
    else if(action==="chip-filter"){
      var area = el.getAttribute("data-area"), key = el.getAttribute("data-key"), value = el.getAttribute("data-value");
      var f = getFiltro(area); f[key] = value; render();
    }
    else if(action==="fin-tab"){ STATE.finUnidade = el.getAttribute("data-unidade"); render(); }
    else if(action==="rh-tab"){ STATE.rhView = el.getAttribute("data-view"); render(); }
    else if(action==="trigger-file"){ document.getElementById("file-input").click(); }
    else if(action==="confirm-import"){ confirmarImportacao(); }
    else if(action==="toggle-sugestao"){
      var idx = +el.getAttribute("data-idx");
      var row = buildDiffRows(STATE.importModal.diff)[idx];
      var id = row.novo ? row.novo.id : row.atual.id;
      STATE.importModal.aceitas[id] = !STATE.importModal.aceitas[id];
      render();
    }
    else if(action==="reset-data"){
      if(confirm("Tem a certeza? Esta ação remove todas as tarefas e histórico guardados neste dispositivo e recarrega a pauta inicial.")){
        Store.limparTudo().then(function(){ location.reload(); });
      }
    }
  });

  document.addEventListener("change", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    if(action==="edit-field"){ applyTaskEdit(el.getAttribute("data-id"), el.getAttribute("data-campo"), el.value); }
    else if(action==="select-filter"){
      var area = el.getAttribute("data-area"), key = el.getAttribute("data-key");
      getFiltro(area)[key] = el.value; render();
    }
    else if(action==="set-theme"){ STATE.theme = el.value; applyTheme(); render(); }
    else if(el.id==="file-input"){ processarFicheiro(el.files[0]); }
  });

  document.addEventListener("input", function(e){
    if(e.target.id==="search-input"){ STATE.searchQuery = e.target.value; renderSearchOnly(); }
    if(e.target.matches('[data-action="edit-field"]') && e.target.tagName==="TEXTAREA"){
      // atualização apenas ao perder foco (blur cobre isto via change não disparar em textarea);
    }
  });
  document.addEventListener("blur", function(e){
    if(e.target && e.target.matches && e.target.matches('textarea[data-action="edit-field"]')){
      applyTaskEdit(e.target.getAttribute("data-id"), e.target.getAttribute("data-campo"), e.target.value);
    }
  }, true);

  document.getElementById("overlay").addEventListener("click", function(){ closeAllOverlays(); render(); });

  document.addEventListener("dragover", function(e){
    if(document.getElementById("dropzone")){ e.preventDefault(); document.getElementById("dropzone").classList.add("is-drag"); }
  });
  document.addEventListener("dragleave", function(e){
    var dz = document.getElementById("dropzone"); if(dz) dz.classList.remove("is-drag");
  });
  document.addEventListener("drop", function(e){
    var dz = document.getElementById("dropzone");
    if(dz){ e.preventDefault(); dz.classList.remove("is-drag"); var f=e.dataTransfer.files[0]; if(f) processarFicheiro(f); }
  });

  document.addEventListener("keydown", function(e){
    var mod = e.metaKey || e.ctrlKey;
    if(mod && e.key.toLowerCase()==="k"){ e.preventDefault(); if(STATE.searchOpen){ closeAllOverlays(); render(); } else { openSearch(); } }
    else if(e.key==="Escape"){ if(STATE.drawerTaskId||STATE.importModal.open||STATE.searchOpen||STATE.configOpen||STATE.mobileSheet){ closeAllOverlays(); render(); } }
    else if(STATE.searchOpen && (e.key==="ArrowDown" || e.key==="ArrowUp")){
      e.preventDefault();
      var total = searchTotalCount();
      if(!total) return;
      if(e.key==="ArrowDown") STATE.searchSelectedIndex = (STATE.searchSelectedIndex+1) % total;
      else STATE.searchSelectedIndex = (STATE.searchSelectedIndex-1+total) % total;
      document.getElementById("modal-root").innerHTML = renderSearchModal();
      var sel = document.querySelector(".searchresult.is-selected");
      if(sel) sel.scrollIntoView({block:"nearest"});
    }
    else if(STATE.searchOpen && e.key==="Enter" && document.activeElement && document.activeElement.id==="search-input"){
      var selEl = document.querySelector(".searchresult.is-selected");
      if(selEl){ e.preventDefault(); selEl.click(); }
    }
  });
}
function renderSearchOnly(){
  STATE.searchSelectedIndex = 0;
  document.getElementById("modal-root").innerHTML = renderSearchModal();
  var el = document.getElementById("search-input");
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function searchTotalCount(){
  var flat = searchFlatList(STATE.searchQuery);
  return flat.acts.length + flat.results.length;
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
async function seedDoZero(){
  SEED_TASKS.forEach(function(t){ if(!t.historico) t.historico=[]; });
  await Store.bulkPutTasks(SEED_TASKS);
  await Store.addImport(SEED_IMPORT);
  await Store.addImport(SEED_IMPORT_2);
  await Store.addImport(SEED_IMPORT_3);
  await Store.setMeta("seedVersion", SEED_VERSION);
  STATE.tasks = SEED_TASKS;
  STATE.imports = [SEED_IMPORT, SEED_IMPORT_2, SEED_IMPORT_3];
}
async function init(){
  applyTheme();
  await Store.init();
  var existentes = await Store.getAllTasks();
  var versaoGuardada = await Store.getMeta("seedVersion");
  if(!existentes.length){
    await seedDoZero();
  } else if(versaoGuardada !== SEED_VERSION){
    /* Este dispositivo tem dados de uma versão anterior deste ficheiro (a pauta
       incorporada mudou desde então). Nunca substituímos silenciosamente — perguntamos. */
    var atualizar = confirm(
      "Este ficheiro traz uma pauta diferente da que está guardada neste navegador (de uma abertura anterior). "+
      "Atualizar os dados para esta pauta agora?\n\nEsta ação substitui as tarefas e o histórico atualmente guardados neste dispositivo pelos desta pauta."
    );
    if(atualizar){
      await Store.limparTudo();
      await seedDoZero();
    } else {
      await Store.setMeta("seedVersion", SEED_VERSION);
      STATE.tasks = existentes;
      STATE.imports = await Store.getAllImports();
    }
  } else {
    STATE.tasks = existentes;
    STATE.imports = await Store.getAllImports();
  }
  STATE.route = parseHash();
  wireEvents();
  render();
}
document.addEventListener("DOMContentLoaded", init);

})();
</script>
